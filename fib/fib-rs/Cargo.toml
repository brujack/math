[package]
name = "fib"
version = "0.1.0"
edition = "2021"
description = "Fibonacci sequence generator — all F(n) with up to 10^X decimal digits"

[[bin]]
name = "fib"
path = "src/main.rs"

[dependencies]
rug = { version = "1", features = ["integer"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
