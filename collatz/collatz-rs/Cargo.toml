[package]
name = "collatz"
version = "0.1.0"
edition = "2021"
description = "Find Collatz chain record-setters up to 10^N"

[[bin]]
name = "collatz"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
