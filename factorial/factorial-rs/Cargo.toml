[package]
name = "factorial"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "factorial"
path = "src/main.rs"

[dependencies]
rug = { version = "1", features = ["integer"] }
rayon = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.release]
opt-level = 3
