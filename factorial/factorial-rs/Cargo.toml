[package]
name = "factorial"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "factorial"
path = "src/main.rs"

[lib]
name = "factorial"
path = "src/lib.rs"

[dependencies]
rug = { version = "1", features = ["integer"] }
rayon = "1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.8"

[[bench]]
name = "factorial"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
missing_debug_implementations = "warn"

[lints.clippy]
wrong_self_convention = "warn"

[profile.release]
opt-level = 3
