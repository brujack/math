# cargo-deny policy for all 11 crates. tests/test_deny_policy.py holds the whole
# file as one expected value, so edit that test in the same change.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]
# rug and gmp-mpfr-sys are LGPL and are the only crates allowed to be.
exceptions = [
    { crate = "rug", allow = ["LGPL-3.0-or-later"] },
    { crate = "gmp-mpfr-sys", allow = ["LGPL-3.0-or-later"] },
]

[advisories]
unmaintained = "all"
unsound = "all"

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
