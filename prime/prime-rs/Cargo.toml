[package]
name = "prime"
version = "0.1.0"
edition = "2021"
description = "Find all primes up to 10^N — parallel segmented sieve + rayon"

[[bin]]
name = "prime"
path = "src/main.rs"

[lib]
name = "prime"
path = "src/lib.rs"

[dependencies]
# Work-stealing thread pool for parallel segment processing.
rayon = "1"

# CLI argument parsing.
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.5"

[[bench]]
name = "prime"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.release]
opt-level   = 3
lto         = "thin"
codegen-units = 1
