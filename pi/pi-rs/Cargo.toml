[package]
name = "pi"
version = "0.1.0"
edition = "2021"
description = "High-precision π calculator — Chudnovsky + Rayon + GMP"

[[bin]]
name = "pi"
path = "src/main.rs"

[lib]
name = "pi"
path = "src/lib.rs"

[dependencies]
# rug wraps GMP (big integers) and MPFR (arbitrary-precision floats).
# Same C libraries as Python's gmpy2, but zero Python overhead and
# true shared-memory parallelism instead of process-per-chunk.
rug = { version = "1", features = ["integer", "float"] }

# Work-stealing thread pool.  rayon::join() recursively splits the
# Chudnovsky binary splitting tree across all cores with zero IPC cost.
rayon = "1"

# CLI argument parsing.
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.5"

[[bench]]
name = "pi"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.release]
opt-level   = 3
lto         = "thin"   # link-time optimisation across crates
codegen-units = 1      # single CGU for best inlining
