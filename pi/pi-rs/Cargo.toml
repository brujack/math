[package]
name = "pi"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "High-precision π calculator — Chudnovsky + Rayon + GMP"

[[bin]]
name = "pi"
path = "src/main.rs"

[lib]
name = "pi"
path = "src/lib.rs"

[dependencies]
rug = { version = "1", features = ["integer", "float"] }
rayon = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.8"

[[bench]]
name = "pi"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
wrong_self_convention = "warn"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
