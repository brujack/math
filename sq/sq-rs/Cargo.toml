[package]
name = "sq"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sq"
path = "src/main.rs"

[lib]
name = "sq"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.8"

[[bench]]
name = "sq"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
missing_debug_implementations = "warn"

[lints.clippy]
wrong_self_convention = "warn"
