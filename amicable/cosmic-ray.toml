# cosmic-ray mutation testing config
# Monthly CI cron via .github/workflows/mutation-testing-python.yml
# Run locally:  make mutants

[cosmic-ray]
module-path = "amicable.py"
timeout = 30.0
excluded-modules = []
test-command = "python3 -m unittest test_amicable"

[cosmic-ray.distributor]
name = "local"

