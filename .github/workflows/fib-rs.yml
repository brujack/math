name: fib-rs

on:
  pull_request:
    branches:
      - master
    paths:
      - "fib/fib-rs/**"
      - ".github/workflows/fib-rs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test fib-rs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: fib/fib-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: GMP cache key
        id: gmpkey
        working-directory: ${{ github.workspace }}
        run: |
          printf 'GMP_MPFR_SYS_CACHE=%s\n' "${RUNNER_TEMP}/gmp-mpfr-sys" >> "$GITHUB_ENV"
          scripts/gmp-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore GMP/MPFR build cache
        if: steps.gmpkey.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gmp-mpfr-sys
          key: ${{ steps.gmpkey.outputs.key }}
          restore-keys: ${{ steps.gmpkey.outputs.prefix }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fib/fib-rs

      # Prebuilt, checksum-verified binaries: compiling these from source cost ~8 min
      # per run. fallback: none makes an unknown tool fail instead of downloading unverified.
      - name: Install cargo-nextest and cargo-machete
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.148,cargo-machete@0.9.2
          fallback: none

      - name: Run tests
        # nextest reads NEXTEST_PROFILE: the ci profile writes the JUnit report
        # test_metrics.py reads, while make test stays the single test definition.
        env:
          NEXTEST_PROFILE: ci
        run: make test

      - name: Install Python dependencies
        if: always()
        run: pip install defusedxml==0.7.1

      - name: Generate test metrics
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/test_metrics.py \
            --repo math \
            --run-id "${GH_RUN_ID}" \
            --junit fib/fib-rs/target/nextest/ci/junit.xml \
            --artifact-name test-metrics-fib-rs
      - name: Upload test metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-metrics-fib-rs
          path: test-metrics.json
          retention-days: 90

  # Runs beside `test`, not after it: tarpaulin rebuilds the crate instrumented, so
  # chaining it onto the tests summed two long jobs. ci-gate.sh gates merge on this
  # check run like any other non-advisory one.
  coverage:
    name: Coverage fib-rs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: fib/fib-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: GMP cache key
        id: gmpkey
        working-directory: ${{ github.workspace }}
        run: |
          printf 'GMP_MPFR_SYS_CACHE=%s\n' "${RUNNER_TEMP}/gmp-mpfr-sys" >> "$GITHUB_ENV"
          scripts/gmp-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore GMP/MPFR build cache
        if: steps.gmpkey.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gmp-mpfr-sys
          key: ${{ steps.gmpkey.outputs.key }}
          restore-keys: ${{ steps.gmpkey.outputs.prefix }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fib/fib-rs

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-tarpaulin@0.37.5
          fallback: none

      - name: Check coverage (≥90%)
        run: cargo tarpaulin --out Json --fail-under 90

      - name: Publish coverage badge
        working-directory: ${{ github.workspace }}
        run: |
          PCT=$(python3 -c "import json,math; d=json.load(open('fib/fib-rs/tarpaulin-report.json')); print(math.floor(d['coverage']))")
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add -b coverage-data --orphan /tmp/cov-data
          mkdir -p /tmp/cov-data/fib
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/fib/rust.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for i in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: fib/rust.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done

  build:
    name: Build fib-rs
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: fib/fib-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: GMP cache key
        id: gmpkey
        working-directory: ${{ github.workspace }}
        run: |
          printf 'GMP_MPFR_SYS_CACHE=%s\n' "${RUNNER_TEMP}/gmp-mpfr-sys" >> "$GITHUB_ENV"
          scripts/gmp-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore GMP/MPFR build cache
        if: steps.gmpkey.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gmp-mpfr-sys
          key: ${{ steps.gmpkey.outputs.key }}
          restore-keys: ${{ steps.gmpkey.outputs.prefix }}

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fib/fib-rs

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fib
          path: fib/fib-rs/target/release/fib
          retention-days: 7
