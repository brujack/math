name: mutation-pr

on:
  pull_request:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutation-pr:
    runs-on: ubuntu-latest
    # 10 minutes only fits a diff touching one or two sub-projects. A change
    # spanning all 8 runs cosmic-ray 8 times and is cancelled mid-step, which
    # fails a REQUIRED check even though the cosmic-ray step is advisory.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: |
          cargo install cargo-mutants --locked
          pip install cosmic-ray

      - name: Detect changed sub-projects
        id: detect
        run: |
          changed=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")

          has_rs=false
          has_py=false
          py_dirs=""

          # Rust: only factorial-rs
          if printf '%s\n' "${changed}" | grep -q '^factorial/factorial-rs/.*\.rs$'; then
            has_rs=true
          fi

          # Python: each sub-project with cosmic-ray.toml
          for dir in sq perfect-numbers factorial amicable pi fib collatz e; do
            if printf '%s\n' "${changed}" | grep -q "^${dir}/.*\.py$"; then
              py_dirs="${py_dirs} ${dir}"
              has_py=true
            fi
          done

          echo "has_rs=${has_rs}" >> "${GITHUB_OUTPUT}"
          echo "has_py=${has_py}" >> "${GITHUB_OUTPUT}"
          echo "py_dirs=${py_dirs}" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Skip — no mutation-covered files changed
        if: steps.detect.outputs.has_rs == 'false' && steps.detect.outputs.has_py == 'false'
        run: echo "No mutation-covered files changed — skipping."

      - name: Get PR diff (for Rust)
        if: steps.detect.outputs.has_rs == 'true'
        run: git diff "origin/${GITHUB_BASE_REF}...HEAD" > /tmp/pr.diff
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Run cargo mutants (factorial-rs)
        if: steps.detect.outputs.has_rs == 'true'
        run: |
          cd factorial/factorial-rs
          cargo mutants --in-diff /tmp/pr.diff --timeout 30 --no-shuffle

      - name: Run cosmic-ray on changed Python sub-projects (advisory)
        if: steps.detect.outputs.has_py == 'true'
        env:
          PY_DIRS: ${{ steps.detect.outputs.py_dirs }}
        run: |
          # cosmic-ray has no --in-diff equivalent: it runs ALL mutations, not just
          # PR-diff mutations. Pre-existing survivors (e.g. sq has 13 at 88.8% kill
          # rate) would cause exit 1 on every Python PR. Report survivors as a
          # warning only; the monthly mutation-testing-python.yml workflow is the
          # authoritative non-blocking gate.
          survivors_total=0
          for dir in ${PY_DIRS}; do
            echo "Running cosmic-ray in ${dir}/"
            cd "${dir}"
            cosmic-ray init cosmic-ray.toml session-pr.sqlite
            cosmic-ray exec cosmic-ray.toml session-pr.sqlite
            s=$(cosmic-ray report session-pr.sqlite | grep -c 'Outcome.SURVIVED' || true)
            survivors_total=$((survivors_total + s))
            rm -f session-pr.sqlite
            cd ..
          done
          if [[ "${survivors_total}" -gt 0 ]]; then
            echo "::warning::${survivors_total} surviving mutant(s) found (advisory — includes pre-existing survivors)"
          else
            echo "mutation-pr: 0 survivors across changed Python sub-projects"
          fi
