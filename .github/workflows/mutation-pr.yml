name: mutation-pr

on:
  pull_request:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutation-pr:
    runs-on: ubuntu-latest
    # 10 minutes only fits a diff touching one or two sub-projects. A change
    # spanning all 8 runs the capped baseline 8 times.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Detect changed sub-projects
        id: detect
        run: |
          changed=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD") || exit 1

          has_rs=false

          # Rust: only factorial-rs
          if printf '%s\n' "${changed}" | grep -q '^factorial/factorial-rs/.*\.rs$'; then
            has_rs=true
          fi

          echo "has_rs=${has_rs}" >> "${GITHUB_OUTPUT}"
          scripts/mutation-pr-detect.sh "origin/${GITHUB_BASE_REF}" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Install GMP and MPFR
        if: steps.detect.outputs.has_py == 'true'
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Install Python dependencies
        if: steps.detect.outputs.has_py == 'true'
        run: pip install mpmath==1.4.1 gmpy2==2.3.2 coverage==7.16.2 cosmic-ray==8.7.0 hypothesis==6.168.5 pytest==9.1.1 pytest-cov==7.1.0 ruff==0.16.4 pyright==1.1.411 pip-audit==2.10.1

      - name: Skip — no mutation-covered files changed
        if: steps.detect.outputs.has_rs == 'false' && steps.detect.outputs.has_py == 'false'
        run: echo "No mutation-covered files changed — skipping."

      - name: Get PR diff (for Rust)
        if: steps.detect.outputs.has_rs == 'true'
        run: git diff "origin/${GITHUB_BASE_REF}...HEAD" > /tmp/pr.diff
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Run cargo mutants (factorial-rs)
        if: steps.detect.outputs.has_rs == 'true'
        run: |
          cd factorial/factorial-rs
          cargo mutants --in-diff /tmp/pr.diff --timeout 30 --no-shuffle

      - name: Run Python mutation baseline on changed sub-projects
        if: steps.detect.outputs.has_py == 'true'
        env:
          PY_DIRS: ${{ steps.detect.outputs.py_dirs }}
        run: |
          # Not advisory: a failing capped baseline fails the check. The monthly
          # mutation-testing-python.yml workflow is the full measurement.
          # Word splitting of PY_DIRS is intentional: dirs are validated names.
          for dir in ${PY_DIRS}; do
            make -C "${dir}" mutants-baseline || exit 1
          done
