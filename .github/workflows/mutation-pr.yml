name: mutation-pr

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Plans the Python units. It always runs and always sets `units` (`[]` when no
  # Python source changed), so the jobs that need it never see an unset output.
  mutation-py-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      units: ${{ steps.plan.outputs.units }}
      base: ${{ steps.base.outputs.sha }}
      py_src_dirs: ${{ steps.detect.outputs.py_src_dirs }}
      py_canary: ${{ steps.detect.outputs.py_canary }}
      has_py: ${{ steps.detect.outputs.has_py }}
      py_dirs: ${{ steps.detect.outputs.py_dirs }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changed sub-projects
        id: detect
        run: scripts/mutation-pr-detect.sh "origin/${GITHUB_BASE_REF}" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Resolve merge base
        id: base
        run: printf 'sha=%s\n' "$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Install GMP and MPFR
        if: steps.detect.outputs.py_src_dirs != ''
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Set up Python
        if: steps.detect.outputs.py_src_dirs != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        if: steps.detect.outputs.py_src_dirs != ''
        run: pip install mpmath==1.4.1 gmpy2==2.3.2 coverage==7.16.2 cosmic-ray==8.7.0 hypothesis==6.168.5 pytest==9.1.1 pytest-cov==7.1.0 ruff==0.17.4 pyright==1.1.411 pip-audit==2.10.1

      - name: Plan Python mutation units
        id: plan
        env:
          PY_SRC_DIRS: ${{ steps.detect.outputs.py_src_dirs }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          # Runs with an empty dir list too: the plan is then empty and units is [].
          # PY_SRC_DIRS is a space-separated list of validated project dirs.
          mkdir -p plan
          read -ra py_dirs <<< "${PY_SRC_DIRS}"
          PLAN_OUT=plan scripts/mutation-pr-plan-python.sh "${BASE_SHA}" "${py_dirs[@]}"
          printf 'units=%s\n' "$(cat plan/units.json)" >> "${GITHUB_OUTPUT}"

      - name: Upload plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-pr-plan
          path: plan/plan.txt
          overwrite: true

  # One matrix leg per planned unit: the changed-line mutants of one shard.
  mutation-py:
    needs: [mutation-py-plan]
    if: needs.mutation-py-plan.outputs.units != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mutation-py-plan.outputs.units) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: pip install mpmath==1.4.1 gmpy2==2.3.2 coverage==7.16.2 cosmic-ray==8.7.0 hypothesis==6.168.5 pytest==9.1.1 pytest-cov==7.1.0 ruff==0.17.4 pyright==1.1.411 pip-audit==2.10.1

      - name: Run mutants on changed lines
        env:
          DIR: ${{ matrix.dir }}
          K: ${{ matrix.k }}
          N: ${{ matrix.n }}
          BASE_SHA: ${{ needs.mutation-py-plan.outputs.base }}
        run: |
          mkdir -p "${RUNNER_TEMP}/status"
          scripts/mutation-pr-diff.sh "${BASE_SHA}" "${DIR}" "${RUNNER_TEMP}/d.diff"
          make -C "${DIR}" mutants-diff DIFF="${RUNNER_TEMP}/d.diff" MUTANT_SHARD="${K}/${N}" STATUS_OUT="${RUNNER_TEMP}/status/${DIR}-${K}"

      - name: Upload unit status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-pr-status-${{ matrix.dir }}-${{ matrix.k }}
          path: ${{ runner.temp }}/status/${{ matrix.dir }}-${{ matrix.k }}
          overwrite: true

  # Proves the Python gate still catches a survivor when the gate's own files change.
  mutation-py-canary:
    needs: [mutation-py-plan]
    if: needs.mutation-py-plan.outputs.py_canary == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: pip install mpmath==1.4.1 gmpy2==2.3.2 coverage==7.16.2 cosmic-ray==8.7.0 hypothesis==6.168.5 pytest==9.1.1 pytest-cov==7.1.0 ruff==0.17.4 pyright==1.1.411 pip-audit==2.10.1

      - name: Gate canary (sq)
        run: |
          # A change to the gate's own files selects no project, so it would merge
          # green untested. Append a space to the one `limit = 10**max_digits` line
          # (13 killed mutants), commit that path alone so HEAD~1 is the clean tree,
          # and require at least one kill. Base HEAD~1 keeps the PR's own sq.py
          # edits out of the canary diff.
          f=sq/sq.py
          n=$(grep -c -x '    limit = 10\*\*max_digits' "${f}") || n=0
          if [ "${n}" != "1" ]; then
            printf 'red: canary line count is %s, expected exactly 1 in %s\n' "${n}" "${f}" | tee -a "${GITHUB_STEP_SUMMARY}" >&2
            exit 1
          fi
          sed -i 's/^    limit = 10\*\*max_digits$/& /' "${f}"
          git -c user.name=ci -c user.email=ci@localhost commit -q -m canary -- "${f}"
          out="${RUNNER_TEMP}/canary"
          mkdir -p "${out}/status"
          PLAN_OUT="${out}" scripts/mutation-pr-plan-python.sh HEAD~1 sq
          scripts/mutation-pr-diff.sh HEAD~1 sq "${out}/d.diff"
          # The verdict reads the status file, so run it even when the session is red.
          make_rc=0
          make -C sq mutants-diff DIFF="${out}/d.diff" MUTANT_SHARD=0/1 STATUS_OUT="${out}/status/sq-0" || make_rc=$?
          verdict_rc=0
          scripts/mutation-pr-verdict-python.sh --expected-dirs sq --min-killed 1 "${out}/plan.txt" "${out}/status" || verdict_rc=$?
          if [ "${make_rc}" != "0" ] || [ "${verdict_rc}" != "0" ]; then
            exit 1
          fi

  # Plans the Rust shards. It always runs and always sets `units` (`[]` when no
  # crate changed), so the jobs that need it never see an unset output. It lists
  # mutants with cargo-mutants but builds nothing, so it has no toolchain step:
  # `cargo mutants --list` runs `cargo metadata` with the runner image's
  # preinstalled cargo, and the mutant list comes from parsing the source, so a
  # cargo version other than the shard jobs' toolchain cannot change K.
  mutation-rs-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      units: ${{ steps.plan.outputs.units }}
      rs_canary: ${{ steps.detect.outputs.rs_canary }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect changed sub-projects
        id: detect
        run: scripts/mutation-pr-detect.sh "origin/${GITHUB_BASE_REF}" >> "${GITHUB_OUTPUT}"
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0
          fallback: none

      - name: Plan Rust mutation shards
        id: plan
        env:
          RS_DIRS: ${{ steps.detect.outputs.rs_dirs }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          # RS_DIRS is a space-separated list of crate dirs from git ls-files.
          # Every Rust job re-resolves origin/${GITHUB_BASE_REF} after its own
          # fetch. That is safe only because mutation-pr-diff.sh diffs three-dot
          # against the fixed merge commit: a master that moved between jobs
          # leaves the merge base, and so K and each shard's count, unchanged.
          # The planner prints units on stdout only; a red plan exits non-zero and
          # fails this step under bash -e before units is written.
          read -ra rs_dirs <<< "${RS_DIRS}"
          if [ "${#rs_dirs[@]}" -eq 0 ]; then
            printf 'units=[]\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          scripts/mutation-rs-plan.sh "origin/${GITHUB_BASE_REF}" "${rs_dirs[@]}" > "${RUNNER_TEMP}/units.json"
          printf 'units=%s\n' "$(cat "${RUNNER_TEMP}/units.json")" >> "${GITHUB_OUTPUT}"

  # One matrix leg per planned shard: the changed-line mutants of one crate shard.
  mutation-rs:
    needs: [mutation-rs-plan]
    if: needs.mutation-rs-plan.outputs.units != '[]'
    name: mutation-rs ${{ matrix.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.mutation-rs-plan.outputs.units) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0
          fallback: none

      - name: GMP cache key
        id: gmpkey
        working-directory: ${{ github.workspace }}
        run: |
          printf 'GMP_MPFR_SYS_CACHE=%s\n' "${RUNNER_TEMP}/gmp-mpfr-sys" >> "$GITHUB_ENV"
          scripts/gmp-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore GMP/MPFR build cache
        if: steps.gmpkey.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gmp-mpfr-sys
          key: ${{ steps.gmpkey.outputs.key }}
          restore-keys: ${{ steps.gmpkey.outputs.prefix }}

      - name: Run Rust mutants on one shard
        env:
          CRATE: ${{ matrix.crate }}
          K: ${{ matrix.k }}
          N: ${{ matrix.n }}
          COUNT: ${{ matrix.count }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          scripts/mutation-pr-run.sh "origin/${GITHUB_BASE_REF}" --shard "${K}/${N}" --expect "${COUNT}" "${CRATE}" 2>&1 | tee "${RUNNER_TEMP}/rs.log"
          rc=${PIPESTATUS[0]}
          set -e
          {
            printf '```\n'
            { grep -E '^(red|green|repro):|MISSED|TIMEOUT|^error:' "${RUNNER_TEMP}/rs.log" || [ $? -eq 1 ]; }
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"

  # Proves the Rust gate still catches a survivor when the gate's own files change.
  mutation-rs-canary:
    needs: [mutation-rs-plan]
    if: needs.mutation-rs-plan.outputs.rs_canary == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable
        with:
          toolchain: stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0
          fallback: none

      - name: GMP cache key
        id: gmpkey
        working-directory: ${{ github.workspace }}
        run: |
          printf 'GMP_MPFR_SYS_CACHE=%s\n' "${RUNNER_TEMP}/gmp-mpfr-sys" >> "$GITHUB_ENV"
          scripts/gmp-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore GMP/MPFR build cache
        if: steps.gmpkey.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gmp-mpfr-sys
          key: ${{ steps.gmpkey.outputs.key }}
          restore-keys: ${{ steps.gmpkey.outputs.prefix }}

      - name: Gate canary (amicable-rs)
        run: |
          # A change to the gate's own files selects no crate, so it would merge
          # green untested. Prove the gate still catches a survivor: append a
          # space to the one `m = 2 * d` line, commit that path alone so HEAD~1
          # is the clean tree, and require at least one caught mutant. The canary
          # goes through the planner, so a planner defect turns it red.
          f=amicable/amicable-rs/src/lib.rs
          n=$(grep -c 'let mut m = 2 \* d;' "${f}") || n=0
          if [ "${n}" != "1" ]; then
            printf 'red: canary line count is %s, expected exactly 1 in %s\n' "${n}" "${f}" | tee -a "${GITHUB_STEP_SUMMARY}" >&2
            exit 1
          fi
          sed -i 's/let mut m = 2 \* d;$/& /' "${f}"
          git -c user.name=ci -c user.email=ci@localhost commit -q -m canary -- "${f}"
          scripts/mutation-rs-plan.sh HEAD~1 amicable/amicable-rs > "${RUNNER_TEMP}/canary-units.json"
          units=$(jq length "${RUNNER_TEMP}/canary-units.json")
          if [ "${units}" != "1" ]; then
            printf 'red: canary planned %s units, expected exactly 1\n' "${units}" | tee -a "${GITHUB_STEP_SUMMARY}" >&2
            exit 1
          fi
          shard_k=$(jq -r '.[0].k' "${RUNNER_TEMP}/canary-units.json")
          shard_n=$(jq -r '.[0].n' "${RUNNER_TEMP}/canary-units.json")
          shard_count=$(jq -r '.[0].count' "${RUNNER_TEMP}/canary-units.json")
          # The run's own repro line names HEAD~1, which exists only in this job.
          printf 'canary repro: git checkout %s, append a space to the "let mut m = 2 * d;" line in %s, commit it, then scripts/mutation-pr-run.sh HEAD~1 --shard %s/%s --expect %s --min-caught 1 amicable/amicable-rs\n' \
            "$(git rev-parse HEAD~1)" "${f}" "${shard_k}" "${shard_n}" "${shard_count}" >> "${GITHUB_STEP_SUMMARY}"
          set +e
          scripts/mutation-pr-run.sh HEAD~1 --shard "${shard_k}/${shard_n}" --expect "${shard_count}" --min-caught 1 amicable/amicable-rs 2>&1 | tee "${RUNNER_TEMP}/canary.log"
          rc=${PIPESTATUS[0]}
          set -e
          {
            printf '```\n'
            { grep -E '^(red|green|repro):|MISSED|TIMEOUT|^error:' "${RUNNER_TEMP}/canary.log" || [ $? -eq 1 ]; }
            printf '```\n'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${rc}"

  # The capped Python baselines of the changed sub-projects, apart from the Rust
  # shards so a Rust install failure cannot skip them.
  mutation-py-baseline:
    needs: [mutation-py-plan]
    if: needs.mutation-py-plan.outputs.has_py == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: pip install mpmath==1.4.1 gmpy2==2.3.2 coverage==7.16.2 cosmic-ray==8.7.0 hypothesis==6.168.5 pytest==9.1.1 pytest-cov==7.1.0 ruff==0.17.4 pyright==1.1.411 pip-audit==2.10.1

      - name: Run Python mutation baseline on changed sub-projects
        env:
          PY_DIRS: ${{ needs.mutation-py-plan.outputs.py_dirs }}
        run: |
          # Not advisory: a failing capped baseline fails the check. The monthly
          # mutation-testing-python.yml workflow is the full measurement.
          # Word splitting of PY_DIRS is intentional: dirs are validated names.
          for dir in ${PY_DIRS}; do
            make -C "${dir}" mutants-baseline || exit 1
          done

  # The required status check on master is this job's id, `mutation-pr`.
  mutation-pr:
    needs:
      - mutation-py-plan
      - mutation-py
      - mutation-py-canary
      - mutation-py-baseline
      - mutation-rs-plan
      - mutation-rs
      - mutation-rs-canary
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check job results
        env:
          RS_PLAN_RESULT: ${{ needs.mutation-rs-plan.result }}
          RS_RESULT: ${{ needs.mutation-rs.result }}
          RS_UNITS: ${{ needs.mutation-rs-plan.outputs.units }}
          RS_CANARY_RESULT: ${{ needs.mutation-rs-canary.result }}
          RS_CANARY: ${{ needs.mutation-rs-plan.outputs.rs_canary }}
          PYB_RESULT: ${{ needs.mutation-py-baseline.result }}
          HAS_PY: ${{ needs.mutation-py-plan.outputs.has_py }}
          PLAN_RESULT: ${{ needs.mutation-py-plan.result }}
          PY_RESULT: ${{ needs.mutation-py.result }}
          CANARY_RESULT: ${{ needs.mutation-py-canary.result }}
          UNITS: ${{ needs.mutation-py-plan.outputs.units }}
          PY_CANARY: ${{ needs.mutation-py-plan.outputs.py_canary }}
        run: |
          # A skip is accepted only when its own `if:` explains it. cancelled and
          # failure are always red, and a stale green status file never stands alone.
          red=0
          fail() {
            printf 'red: %s\n' "$1" | tee -a "${GITHUB_STEP_SUMMARY}" >&2
            red=1
          }
          [ "${RS_PLAN_RESULT}" = "success" ] || fail "mutation-rs-plan result is '${RS_PLAN_RESULT}'"
          case "${RS_RESULT}" in
            success) ;;
            skipped) [ "${RS_UNITS}" = "[]" ] || fail "mutation-rs skipped but units is '${RS_UNITS}'" ;;
            *) fail "mutation-rs result is '${RS_RESULT}'" ;;
          esac
          case "${RS_CANARY_RESULT}" in
            success) ;;
            skipped) [ "${RS_CANARY}" != "true" ] || fail "mutation-rs-canary skipped but rs_canary is true" ;;
            *) fail "mutation-rs-canary result is '${RS_CANARY_RESULT}'" ;;
          esac
          case "${PYB_RESULT}" in
            success) ;;
            skipped) [ "${HAS_PY}" != "true" ] || fail "mutation-py-baseline skipped but has_py is true" ;;
            *) fail "mutation-py-baseline result is '${PYB_RESULT}'" ;;
          esac
          [ "${PLAN_RESULT}" = "success" ] || fail "mutation-py-plan result is '${PLAN_RESULT}'"
          case "${PY_RESULT}" in
            success) ;;
            skipped) [ "${UNITS}" = "[]" ] || fail "mutation-py skipped but units is '${UNITS}'" ;;
            *) fail "mutation-py result is '${PY_RESULT}'" ;;
          esac
          case "${CANARY_RESULT}" in
            success) ;;
            skipped) [ "${PY_CANARY}" != "true" ] || fail "mutation-py-canary skipped but py_canary is true" ;;
            *) fail "mutation-py-canary result is '${CANARY_RESULT}'" ;;
          esac
          exit "${red}"

      # The steps below run even when the result check above went red: a unit
      # with a survivor fails its make step, so mutation-py is 'failure', and
      # only the verdict prints the survivor keys and the MUTANT_SHARD repro.
      # The job stays red through the failed check step either way.
      - name: Download plan
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mutants-pr-plan
          path: plan
          digest-mismatch: error

      - name: Download unit statuses
        if: ${{ !cancelled() && needs.mutation-py-plan.outputs.units != '[]' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mutants-pr-status-*
          merge-multiple: true
          path: status
          digest-mismatch: error

      - name: Python verdict
        if: ${{ !cancelled() }}
        env:
          PY_SRC_DIRS: ${{ needs.mutation-py-plan.outputs.py_src_dirs }}
        run: |
          mkdir -p status
          scripts/mutation-pr-verdict-python.sh --expected-dirs "${PY_SRC_DIRS}" plan/plan.txt status
