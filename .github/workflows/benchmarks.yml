name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 1 * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install GMP/MPFR/MPC
        run: sudo apt-get install -y libgmp-dev libmpfr-dev libmpc-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Run all benchmarks
        run: |
          # "<crate dir>:<bench target>". The target is spelled out rather than
          # derived from the directory because two of the eleven do not match:
          # perfect-numbers/ declares perfect_numbers and twin-primes/ declares
          # twin_primes. A basename-derived name silently breaks exactly those.
          #
          # --bench is required. A bare `cargo bench` also runs each crate's
          # default libtest harness, which rejects Criterion's --output-format
          # and aborts before any benchmark runs — that is why every monthly run
          # since 2026-06-01 produced an empty output.txt and blamed the store
          # step below. The old `2>/dev/null ... || true` discarded both the exit
          # code and the message naming the flag.
          failed_crates=()
          for pair in \
            factorial/factorial-rs:factorial \
            pi/pi-rs:pi \
            e/e-rs:e \
            fib/fib-rs:fib \
            collatz/collatz-rs:collatz \
            amicable/amicable-rs:amicable \
            prime/prime-rs:prime \
            perfect-numbers/perfect-numbers-rs:perfect_numbers \
            twin-primes/twin-primes-rs:twin_primes \
            goldbach/goldbach-rs:goldbach \
            sq/sq-rs:sq; do
            dir="${pair%:*}"
            bench="${pair##*:}"
            printf 'Benchmarking %s (--bench %s)...\n' "${dir}" "${bench}"
            if ! cargo bench --manifest-path "${dir}/Cargo.toml" \
                 --bench "${bench}" -- --output-format bencher >> output.txt; then
              failed_crates+=("${dir}")
            fi
          done

          # Report every failure rather than stopping at the first: across
          # eleven crates on a monthly job, which ones broke is the useful part.
          if [[ ${#failed_crates[@]} -gt 0 ]]; then
            printf 'bench failed: %s\n' "${failed_crates[@]}" >&2
            exit 1
          fi

          # A loop that benchmarks eleven crates must not report success having
          # produced nothing. This is the check that would have caught the bug
          # directly instead of via the store action.
          if [[ ! -s output.txt ]]; then
            printf 'no benchmark output produced\n' >&2
            exit 1
          fi

      - name: Store benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: cargo
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          comment-on-alert: true
          alert-threshold: "130%"
          fail-on-alert: true
