name: amicable.py

on:
  pull_request:
    branches: [master]
    paths:
      - "amicable/**"
      - ".github/workflows/amicable-py.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: pip install ruff coverage hypothesis pyright
      - run: make test
        working-directory: amicable
      - name: Run pyright
        run: pyright
        working-directory: amicable
      - run: make coverage
        working-directory: amicable

      - name: Publish coverage badge
        working-directory: ${{ github.workspace }}
        run: |
          cd amicable && python3 -m coverage json -o /tmp/cov.json && cd ..
          PCT=$(python3 -c "import json,math; d=json.load(open('/tmp/cov.json')); print(math.floor(d['totals']['percent_covered']))")
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add -b coverage-data --orphan /tmp/cov-data
          mkdir -p /tmp/cov-data/amicable
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/amicable/python.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for i in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: amicable/python.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done

      - name: Benchmark (timeout gate)
        run: make benchmark
        working-directory: amicable
        continue-on-error: true
