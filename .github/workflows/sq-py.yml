name: sq.py

on:
  pull_request:
    branches:
      - master
    paths:
      - "sq/*.py"
      - "sq/install_deps.sh"
      - "sq/Makefile"
      - ".github/workflows/sq-py.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test sq.py
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sq
    steps:
      - uses: actions/checkout@v5

      - name: Install Python dependencies
        run: pip install ruff coverage hypothesis

      - name: Run tests
        run: make test
      - name: Check coverage (>=90%)
        run: make coverage
      - name: Benchmark (timeout gate)
        run: make benchmark
        continue-on-error: true
