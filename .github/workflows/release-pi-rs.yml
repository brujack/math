name: release-pi-rs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix (e.g. 1.2.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release pi-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          checked=$(scripts/check-release-version.sh pi/pi-rs "${VERSION}")
          echo "version=${checked}" >> "$GITHUB_OUTPUT"

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: pi/pi-rs

      # Prebuilt, checksum-verified binaries; fallback: none makes an unknown tool
      # fail instead of downloading unverified.
      - name: Install cargo-nextest and cargo-machete
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.148,cargo-machete@0.9.2
          fallback: none

      - name: Run tests
        run: make test
        working-directory: pi/pi-rs

      - name: Install cargo-auditable
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-auditable@0.7.5
          fallback: none

      - name: Build release binary
        run: cargo auditable build --release
        working-directory: pi/pi-rs

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4
        with:
          config: cliff.toml
          args: --unreleased --tag "pi-v${{ steps.version.outputs.version }}" --strip all --include-path "pi/**" --tag-pattern "^pi-v.*"
        env:
          OUTPUT: /tmp/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate SHA256 checksum
        run: |
          (cd pi/pi-rs/target/release && sha256sum pi) > pi/pi-rs/target/release/pi.sha256
          cat pi/pi-rs/target/release/pi.sha256

      - uses: ./.github/actions/sbom-sign
        with:
          binary_path: pi/pi-rs/target/release
          binary_name: pi

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "pi-v${VERSION}"
          git push origin "pi-v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: "pi-v${{ steps.version.outputs.version }}"
          name: "pi v${{ steps.version.outputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            pi/pi-rs/target/release/pi
            pi/pi-rs/target/release/pi.sha256
            pi/pi-rs/target/release/pi.sbom.spdx.json
            pi/pi-rs/target/release/pi.bundle
          fail_on_unmatched_files: true
