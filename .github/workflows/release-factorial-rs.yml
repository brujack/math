name: release-factorial-rs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix (e.g. 1.2.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release factorial-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: factorial/factorial-rs

      - name: Run tests
        run: make test
        working-directory: factorial/factorial-rs

      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked

      - name: Build release binary
        run: cargo auditable build --release
        working-directory: factorial/factorial-rs

      - name: Generate CHANGELOG
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2  # v4
        with:
          config: cliff.toml
          args: --verbose --include-path "factorial/**" --tag-pattern "factorial-v.*"
        env:
          OUTPUT: factorial/factorial-rs/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes (latest only)
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2  # v4
        with:
          config: cliff.toml
          args: --latest --strip all --include-path "factorial/**" --tag-pattern "factorial-v.*"
        env:
          OUTPUT: /tmp/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit CHANGELOG
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add factorial/factorial-rs/CHANGELOG.md
          git diff --staged --quiet && exit 0
          git commit -m "chore(changelog): update factorial for v${VERSION}"
          git push

      - name: Generate SHA256 checksum
        run: |
          (cd factorial/factorial-rs/target/release && sha256sum factorial) > factorial/factorial-rs/target/release/factorial.sha256
          cat factorial/factorial-rs/target/release/factorial.sha256

      - uses: ./.github/actions/sbom-sign
        with:
          binary_path: factorial/factorial-rs/target/release
          binary_name: factorial

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "factorial-v${VERSION}"
          git push origin "factorial-v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: "factorial-v${{ inputs.version }}"
          name: "factorial v${{ inputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            factorial/factorial-rs/target/release/factorial
            factorial/factorial-rs/target/release/factorial.sha256
            factorial/factorial-rs/target/release/factorial.sbom.spdx.json
            factorial/factorial-rs/target/release/factorial.bundle
          fail_on_unmatched_files: true
