name: factorial.py

on:
  pull_request:
    branches:
      - master
    paths:
      - "factorial/*.py"
      - "factorial/install_deps.sh"
      - "factorial/Makefile"
      - "factorial/pyrightconfig.json"
      - ".github/workflows/factorial-py.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test factorial.py
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: factorial
    steps:
      - uses: actions/checkout@v6

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Install Python dependencies
        run: pip install mpmath gmpy2 coverage ruff hypothesis pyright pip-audit

      - name: Run tests
        run: make test

      - name: Run pyright
        run: pyright

      - name: Run pip-audit
        run: pip-audit
        continue-on-error: true

      - name: Generate test metrics
        if: always()
        continue-on-error: true
        working-directory: factorial
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_WORKSPACE: ${{ github.workspace }}
        run: |
          python3 "${GH_WORKSPACE}/scripts/time_tests.py" \
            --repo math \
            --run-id "${GH_RUN_ID}" \
            --module test_factorial \
            --artifact-name test-metrics-factorial-py
      - name: Upload test metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-metrics-factorial-py
          path: factorial/test-metrics.json
          retention-days: 90
      - name: Check coverage (>=90%)
        run: make coverage

      - name: Publish coverage badge
        working-directory: ${{ github.workspace }}
        run: |
          cd factorial && python3 -m coverage json -o /tmp/cov.json && cd ..
          PCT=$(python3 -c "import json,math; d=json.load(open('/tmp/cov.json')); print(math.floor(d['totals']['percent_covered']))")
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add -b coverage-data --orphan /tmp/cov-data
          mkdir -p /tmp/cov-data/factorial
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/factorial/python.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for i in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: factorial/python.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done

      - name: Benchmark (timeout gate)
        run: make benchmark
        continue-on-error: true
