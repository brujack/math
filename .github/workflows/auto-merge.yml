name: auto-merge

on:
  pull_request:
    # ready_for_review re-runs the workflow when a draft is marked ready; the
    # default types omit it. labeled re-runs the guard when automerge-ok is
    # applied after the PR opens.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches:
      - master

# Renovate applies labels in a burst, each firing a `labeled` run; cancel the
# superseded ones. A job-level label filter that skips reads as passing, so the
# filter is not used -- the guard step decides instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -e
          GITLEAKS_VER="8.21.2"
          wget -qO /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VER}/gitleaks_${GITLEAKS_VER}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan for secrets
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --log-opts "HEAD~50..HEAD" \
            --verbose

  snyk-scan:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Snyk CLI
        run: |
          curl -sL https://static.snyk.io/cli/latest/snyk-linux -o /tmp/snyk
          chmod +x /tmp/snyk
          sudo mv /tmp/snyk /usr/local/bin/snyk

      - name: Run Snyk Code scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test

  bash-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install bats
        run: sudo apt-get install -y bats

      - name: Install shellcheck (pinned)
        env:
          SC_VER: "0.11.0"
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VER}/shellcheck-v${SC_VER}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m755 "/tmp/shellcheck-v${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: ${SC_VER}"

      # Floor set from CI's own first measurement, not a local run. This job
      # measured 267/1048 = 25% on ubuntu-latest, identical to the local macOS
      # figure including both heuristic disagreements. FLOOR sits one point
      # below at 24, matching dotfiles, ai-config and terraform_ansible.
      #
      # Read this gate for what it is: 19 of the 26 instrumented files are
      # per-subproject install_deps.sh that no suite invokes, so 73% of the
      # denominator can never move. They stay in because untested is not
      # uncoverable -- dropping them would raise the number by deleting the
      # untested majority. The floor is therefore a ratchet against
      # regression in the reachable quarter, not a quality bar for the repo.
      #
      # FLOOR is defined once below and referenced by the gate, the reminder
      # condition and its message, so raising it is a one-line change.
      - name: Run bash coverage (bootstrap gate)
        run: |
          make bash-coverage > /tmp/bash-cov-out.txt 2>&1 || { cat /tmp/bash-cov-out.txt; exit 1; }
          cat /tmp/bash-cov-out.txt
          # Single source of truth for the floor -- referenced by the gate,
          # the placeholder reminder, and its message. Raising the floor is
          # therefore a ONE-line change; leaving it a literal in three places
          # is what would let the reminder keep announcing "1%" after the
          # floor moved, which is a false statement on every PR.
          FLOOR=24
          PCT=$(grep "^Overall bash coverage:" /tmp/bash-cov-out.txt | grep -oE '[0-9]+')
          if [ -z "${PCT}" ]; then
            printf "FAIL: coverage output not found\n" >&2
            exit 1
          fi
          printf "Coverage: %d%%\n" "${PCT}"
          if [ "${PCT}" -lt "${FLOOR}" ]; then
            printf "FAIL: bash coverage %d%% is below the %d%% gate\n" "${PCT}" "${FLOOR}" >&2
            exit 1
          fi
          # Self-surfacing placeholder reminder -- see the TODO above. Fires
          # while the floor sits far below the measured figure; disappears on
          # its own once the floor is raised, so it cannot become stale noise.
          if [ "$((PCT - FLOOR))" -gt 20 ]; then
            printf "::warning::bash-coverage floor (%d%%) is still the bootstrap placeholder; measured %d%% -- raise FLOOR in auto-merge.yml\n" "${FLOOR}" "${PCT}"
          fi

  claude-md-budget:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # A PR that changes CLAUDE.md while it is over the byte ceiling fails; one
      # that leaves it untouched only warns, so an over-ceiling master does not
      # block unrelated PRs.
      - name: CLAUDE.md byte ceiling
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # GitHub runs `shell: bash` as `bash -eo pipefail`; both commands
          # below exit non-zero by design, so errexit is off and every exit
          # status is read explicitly.
          set +e
          git diff --quiet "${BASE}" HEAD -- CLAUDE.md
          diff_rc=$?
          if [ "${diff_rc}" -gt 1 ]; then
            echo "::error::git diff against base ${BASE} failed (exit ${diff_rc})"
            exit 1
          fi
          if [ "${diff_rc}" -eq 1 ]; then
            echo "PR changes CLAUDE.md"
          else
            echo "PR does not change CLAUDE.md"
          fi
          output=$(python3 scripts/claude_md_budget.py HEAD 2>&1)
          budget_rc=$?
          printf '%s\n' "${output}"
          if [ "${budget_rc}" -eq 0 ]; then
            exit 0
          fi
          if [ "${budget_rc}" -eq 1 ] && [ "${diff_rc}" -eq 1 ]; then
            echo "::error::CLAUDE.md budget check failed and this PR changes CLAUDE.md: ${output%%$'\n'*}"
            exit 1
          fi
          if [ "${budget_rc}" -eq 1 ]; then
            echo "::warning::CLAUDE.md budget check failed but this PR leaves CLAUDE.md unchanged: ${output%%$'\n'*}"
            exit 0
          fi
          echo "::error::claude_md_budget.py failed (exit ${budget_rc})"
          exit 1

  auto-merge:
    needs: [secret-scan, bash-coverage, claude-md-budget]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Hold unlabelled bot PRs for triage
        id: hold
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Renovate's `automerge: false` for majors was bypassed: this job filtered
        # on nothing, so majors auto-merged against the repo's own declared policy.
        #
        # AFFIRMATIVE label, not `!major`. Excluding a negative fails OPEN -- every
        # way labelling can break yields a PR without the label, which an exclusion
        # then merges. Requiring `automerge-ok` fails CLOSED.
        #
        # KEYED ON is_bot, not a login string. Matching `app/renovate` alone let
        # every other bot (dependabot, github-actions[bot], a changed login form)
        # fall through to merge. Any bot needs the AFFIRMATIVE `automerge-ok`
        # label; humans merge as before. An empty login or an unreadable is_bot
        # exits red: unknown is not safe.
        #
        # The GITHUB_OUTPUT + `if:` on the merge step is load-bearing. An earlier
        # draft used `exit 0` in this step to hold -- which does NOT stop the next
        # step, so the merge ran anyway while the log claimed it was held. Do not
        # re-split this into an exit-code guard.
        #
        # A DRAFT is held green too: gh pr merge refuses drafts, so trying turned
        # this job red on every draft push (math's CLAUDE.md opens own PRs as
        # drafts). The ready_for_review trigger re-runs the job and merges.
        #
        # Exit codes differ on purpose: a missing label is NORMAL (green, held); a
        # failed author or label query is a BROKEN INSTRUMENT (red), because
        # falling through to merge on a query failure is the guard disabling
        # itself quietly.
        run: |
          author=$(gh pr view "${PR_NUMBER}" --json author,isDraft --jq '[.author.is_bot, .author.login, .isDraft] | @tsv') \
            || { echo "cannot determine PR author -- refusing to auto-merge" >&2; exit 1; }
          is_bot=${author%%$'\t'*}
          rest=${author#*$'\t'}
          login=${rest%%$'\t'*}
          is_draft=${rest#*$'\t'}
          if [ -z "${login}" ]; then
            echo "empty PR author login -- refusing to auto-merge" >&2
            exit 1
          fi
          if [ "${is_bot}" != "true" ] && [ "${is_bot}" != "false" ]; then
            echo "unreadable is_bot (${is_bot}) -- refusing to auto-merge" >&2
            exit 1
          fi
          if [ "${is_draft}" != "true" ] && [ "${is_draft}" != "false" ]; then
            echo "unreadable isDraft (${is_draft}) -- refusing to auto-merge" >&2
            exit 1
          fi
          if [ "${is_draft}" = "true" ]; then
            echo "draft PR -- holding; the ready_for_review run merges"
            echo "merge=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ "${is_bot}" = "true" ]; then
            labels=$(gh pr view "${PR_NUMBER}" --json labels --jq '.labels[].name') \
              || { echo "cannot read PR labels -- refusing to auto-merge" >&2; exit 1; }
            printf '%s\n' "${labels}" | grep -qx 'automerge-ok' \
              || { echo "bot PR (${login}) lacks automerge-ok -- leaving open for triage"
                   echo "merge=false" >> "${GITHUB_OUTPUT}"
                   exit 0; }
          fi
          echo "merge=true" >> "${GITHUB_OUTPUT}"
          echo "cleared to merge (author=${login}, is_bot=${is_bot})"

      - name: Gate and merge
        if: steps.hold.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          PR=$(gh pr list --head "${HEAD_REF}" \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [[ -n "${PR}" ]]; then
            ./scripts/ci-gate.sh "${PR}" && gh pr merge "${PR}" --squash
          fi
