name: collatz.py

on:
  pull_request:
    branches:
      - master
    paths:
      - "collatz/*.py"
      - "collatz/install_deps.sh"
      - "collatz/Makefile"
      - ".github/workflows/collatz-py.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test collatz.py
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: collatz
    steps:
      - uses: actions/checkout@v5

      - name: Install Python dependencies
        run: pip install ruff coverage hypothesis

      - name: Run tests
        run: make test

      - name: Check coverage (>=90%)
        run: make coverage

      - name: Publish coverage badge
        working-directory: ${{ github.workspace }}
        run: |
          cd collatz && python3 -m coverage json -o /tmp/cov.json && cd ..
          PCT=$(python3 -c "import json,math; d=json.load(open('/tmp/cov.json')); print(math.floor(d['totals']['percent_covered']))")
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add /tmp/cov-data --orphan coverage-data
          mkdir -p /tmp/cov-data/collatz
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/collatz/python.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for i in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: collatz/python.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done

      - name: Benchmark (timeout gate)
        run: make benchmark
        continue-on-error: true
