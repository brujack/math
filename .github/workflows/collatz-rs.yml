name: collatz-rs

on:
  pull_request:
    branches:
      - master
    paths:
      - "collatz/collatz-rs/**"
      - ".github/workflows/collatz-rs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test collatz-rs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collatz/collatz-rs
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: collatz/collatz-rs

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run tests
        run: make test

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Check coverage (>=90%)
        run: cargo tarpaulin --fail-under 90

  build:
    name: Build collatz-rs
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: collatz/collatz-rs
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: collatz/collatz-rs

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: collatz
          path: collatz/collatz-rs/target/release/collatz
          retention-days: 7
