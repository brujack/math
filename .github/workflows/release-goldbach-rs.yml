name: release-goldbach-rs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix (e.g. 1.2.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release goldbach-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          checked=$(scripts/check-release-version.sh goldbach/goldbach-rs "${VERSION}")
          echo "version=${checked}" >> "$GITHUB_OUTPUT"

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: goldbach/goldbach-rs

      # Prebuilt, checksum-verified binaries; fallback: none makes an unknown tool
      # fail instead of downloading unverified.
      - name: Install cargo-nextest and cargo-machete
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.148,cargo-machete@0.9.2
          fallback: none

      - name: Run tests
        run: make test
        working-directory: goldbach/goldbach-rs

      - name: Install cargo-auditable
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-auditable@0.7.5
          fallback: none

      - name: Build release binary
        run: cargo auditable build --release
        working-directory: goldbach/goldbach-rs

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4
        with:
          config: cliff.toml
          args: --unreleased --tag "goldbach-v${{ steps.version.outputs.version }}" --strip all --include-path "goldbach/**" --tag-pattern "^goldbach-v.*"
        env:
          OUTPUT: /tmp/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate SHA256 checksum
        run: |
          (cd goldbach/goldbach-rs/target/release && sha256sum goldbach) > goldbach/goldbach-rs/target/release/goldbach.sha256
          cat goldbach/goldbach-rs/target/release/goldbach.sha256

      - name: Write third-party notices
        run: |
          mkdir -p "${RUNNER_TEMP}/notices"
          scripts/third-party-notices.sh goldbach/goldbach-rs "${RUNNER_TEMP}/notices"

      - uses: ./.github/actions/sbom-sign
        with:
          binary_path: goldbach/goldbach-rs/target/release
          binary_name: goldbach

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "goldbach-v${VERSION}"
          git push origin "goldbach-v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: "goldbach-v${{ steps.version.outputs.version }}"
          name: "goldbach v${{ steps.version.outputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            goldbach/goldbach-rs/target/release/goldbach
            goldbach/goldbach-rs/target/release/goldbach.sha256
            goldbach/goldbach-rs/target/release/goldbach.sbom.spdx.json
            goldbach/goldbach-rs/target/release/goldbach.bundle
            ${{ runner.temp }}/notices/THIRD-PARTY-NOTICES.txt
          fail_on_unmatched_files: true
