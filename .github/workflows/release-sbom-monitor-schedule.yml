name: Release SBOM Monitor (scheduled)

on:
  schedule:
    - cron: "0 13 3 * *"
  workflow_dispatch:

jobs:
  amicable:
    uses: ./.github/workflows/release-sbom-monitor.yml
    with:
      binary_name: amicable
      release_tag_pattern: "amicable-v"
    permissions:
      contents: read
      issues: write
  collatz:
    uses: ./.github/workflows/release-sbom-monitor.yml
    with:
      binary_name: collatz
      release_tag_pattern: "collatz-v"
    permissions:
      contents: read
      issues: write
  e:
