name: mutation-testing

# Runs cargo-mutants against Rust crates to verify tests actually catch bugs.
# Coverage % measures whether code is exercised; mutation testing measures
# whether tests catch behavior changes.
#
# Triggered manually (workflow_dispatch) or monthly on schedule. Not on every PR
# because mutant runs can take 10+ minutes per crate. One job per crate.

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Specific crate to test (relative path, e.g. 'collatz/collatz-rs'). Leave empty for all."
        required: false
        default: ""
  schedule:
    # Monthly run catches test-quality regressions
    - cron: "0 4 1 * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    name: List crates and build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: List crates and build matrix
        id: plan
        env:
          CRATE: ${{ github.event.inputs.crate }}
        run: |
          # Tracked manifests only: `find` also matched tests/fixtures/**/Cargo.toml.
          tracked=()
          while IFS= read -r manifest; do
            tracked+=("$(dirname "${manifest}")")
          done < <(git ls-files '*/*-rs/Cargo.toml')

          if [[ -n "${CRATE}" ]]; then
            # Free text from a dispatch input must not reach GITHUB_OUTPUT
            # unchecked (a newline would write a second output line).
            match=0
            for dir in "${tracked[@]}"; do
              [[ "${dir}" == "${CRATE}" ]] && match=1
            done
            if [[ ${match} -eq 0 ]]; then
              printf 'error: unknown crate %q (not a tracked */*-rs crate)\n' "${CRATE}" >&2
              exit 1
            fi
            dirs=("${CRATE}")
          else
            dirs=("${tracked[@]}")
          fi

          # An empty list (a layout change or a git failure) would build an
          # empty matrix and report green having tested nothing.
          if [[ ${#dirs[@]} -eq 0 ]]; then
            printf "error: no crates found to test — refusing to report green\n" >&2
            exit 1
          fi

          # The one slug function: the directory with / replaced by -. Artifact
          # names cannot contain /, and expressions have no string replace, so
          # the slug travels in the matrix and units is read back from it.
          matrix=$(jq -n -c '{include: [$ARGS.positional[] | {crate: ., slug: gsub("/"; "-")}]}' --args "${dirs[@]}")
          units=$(jq -r '[.include[].slug] | join(" ")' <<< "${matrix}")
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"
          printf 'units=%s\n' "${units}" >> "${GITHUB_OUTPUT}"

  mutants:
    name: Mutation ${{ matrix.crate }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mark job start
        run: mkdir -p "${GITHUB_WORKSPACE}/marker" && date -u > "${GITHUB_WORKSPACE}/marker/job-began"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Run mutants
        env:
          CRATE_DIR: ${{ matrix.crate }}
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/status"
          # make exits 2 for ANY failed recipe, which the classifier reads as
          # survivors (green). The recipe records cargo-mutants' own exit code
          # in mutants.out/exit-code; classify on that, and fail closed when
          # it is missing (the recipe died before cargo-mutants ran).
          make -C "${CRATE_DIR}" mutants || true
          code_file="${CRATE_DIR}/mutants.out/exit-code"
          if [[ ! -f "${code_file}" ]]; then
            printf 'red: %s - no mutants.out/exit-code\n' "${CRATE_DIR}" \
              | tee -a "${GITHUB_STEP_SUMMARY}" "${GITHUB_WORKSPACE}/status/${SLUG}"
            exit 1
          fi
          rc=$(<"${code_file}")
          # The classifier's `-eq` reads '' or text as 0 (green), so reject
          # anything but a plain integer before it can see the value.
          if [[ ! "${rc}" =~ ^(0|[1-9][0-9]{0,2})$ ]]; then
            printf 'red: %s - mutants.out/exit-code is not an integer\n' "${CRATE_DIR}" \
              | tee -a "${GITHUB_STEP_SUMMARY}" "${GITHUB_WORKSPACE}/status/${SLUG}"
            exit 1
          fi
          # Capture the verdict and its exit code BEFORE any pipe. Piping the
          # classifier into tee makes the pipeline's status tee's, which always
          # succeeds -- so a red crate was printed, written to status/, and
          # then silently dropped. Measured: the first full sweep reported
          # success with two red crates in its own log.
          # `|| cls=$?` and not `; cls=$?`: a command-substitution assignment
          # takes the command's exit status, so under GitHub's `bash -e` a red
          # verdict would abort the block here instead of being recorded.
          cls=0
          # 2>&1: the classifier prints green verdicts to stdout and red ones
          # to stderr. Capturing stdout alone leaves status/<slug> empty for
          # exactly the crates the notify job needs to name.
          verdict=$("${GITHUB_WORKSPACE}/scripts/mutation-classify.sh" \
            "${rc}" "${CRATE_DIR}/mutants.out/outcomes.json" "${CRATE_DIR}" 2>&1) || cls=$?
          printf '%s\n' "${verdict}" \
            | tee -a "${GITHUB_STEP_SUMMARY}" "${GITHUB_WORKSPACE}/status/${SLUG}"
          exit "${cls}"

      - name: Record unfinished crate
        if: cancelled()
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/status"
          status_file="${GITHUB_WORKSPACE}/status/${SLUG}"
          if [[ ! -e "${status_file}" ]]; then
            printf "red: %s — did not finish (cancelled or timed out)\n" "${SLUG}" > "${status_file}"
          fi

      - name: Upload crate status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-status-${{ matrix.slug }}
          path: |
            status/
            marker/
          retention-days: 30

      - name: Upload crate output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-output-${{ matrix.slug }}
          # marker/ keeps the artifact root at the workspace, so the crate
          # prefix survives and eleven trees do not collide when merged.
          path: |
            ${{ matrix.crate }}/mutants.out/
            marker/
          retention-days: 30

  notify:
    needs: [setup, mutants]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: dl
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: mutants-status-*
          merge-multiple: true
          path: artifact
          digest-mismatch: error
      - name: File, comment, or close the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.mutants.result }}
          DL_OUTCOME: ${{ steps.dl.outcome }}
          ARTIFACT_DIR: artifact
          EXPECTED_STATUS_UNITS: ${{ needs.setup.outputs.units }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: "mutation-testing: monthly run failed"
          ISSUE_LABEL: mutation-failure
          UNIT_NOUN: crate
          REPO: ${{ github.repository }}
          FULL_SWEEP: ${{ format('{0}', inputs.crate) == '' && 'true' || 'false' }}
        run: scripts/mutation-notify.sh
      # ai-config's mutation-review.yml downloads the exact name mutants-output.
      # Into outputs/, never artifact/: mutation-notify.sh reads extra root
      # entries there as a different attestation cause.
      - name: Download crate outputs
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mutants-output-*
          merge-multiple: true
          path: outputs
          digest-mismatch: error
      - name: Upload mutants output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-output
          path: outputs/
          retention-days: 30
          overwrite: true
