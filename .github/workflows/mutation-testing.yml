name: mutation-testing

# Runs cargo-mutants against Rust crates to verify tests actually catch bugs.
# Coverage % measures whether code is exercised; mutation testing measures
# whether tests catch behavior changes.
#
# Triggered manually (workflow_dispatch) or weekly on schedule. Not on every PR
# because mutant runs can take 10+ minutes per crate.

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Specific crate to test (relative path, e.g. 'collatz/collatz-rs'). Leave empty for all."
        required: false
        default: ""
  schedule:
    # Monthly run catches test-quality regressions
    - cron: "0 4 1 * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mark job start
        run: mkdir -p "${GITHUB_WORKSPACE}/marker" && date -u > "${GITHUB_WORKSPACE}/marker/job-began"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutants
        env:
          CRATE: ${{ github.event.inputs.crate }}
        run: |
          target="${CRATE}"
          if [[ -n "${target}" ]]; then
            crate_dirs="${target}"
          else
            crate_dirs=$(find . -name Cargo.toml -not -path '*/target/*' -not -path '*/.cache/*' -exec dirname {} \;)
          fi

          # Without this, an empty crate_dirs (find failure, bad dispatch input,
          # or a repo layout change) skips the loop entirely and exits 0 --
          # reporting green having tested nothing. The classifier catches an
          # untested crate; only this catches an untested run.
          if [[ -z "${crate_dirs//[[:space:]]/}" ]]; then
            printf "error: no crates found to test — refusing to report green\n" >&2
            exit 1
          fi
          printf "crates to test: %s\n" "$(printf '%s\n' ${crate_dirs} | wc -l | tr -d ' ')"

          mkdir -p "${GITHUB_WORKSPACE}/status"
          failed=0
          for crate_dir in ${crate_dirs}; do
            printf "\n=== Mutation testing %s ===\n" "${crate_dir}"
            rc=0
            make -C "${crate_dir}" mutants || rc=$?
            slug="$(printf '%s' "${crate_dir#./}" | tr '/' '-')"
            # Capture the verdict and its exit code BEFORE any pipe. Piping the
            # classifier into tee makes the pipeline's status tee's, which always
            # succeeds -- so a red crate was printed, written to status/, and
            # then silently dropped from `failed`. Measured: the first full sweep
            # reported success with two red crates in its own log.
            # `|| cls=$?` and not `; cls=$?`: a command-substitution assignment
            # takes the command's exit status, so under GitHub's `bash -e` a red
            # verdict would abort the block here instead of being recorded.
            cls=0
            # 2>&1: the classifier prints green verdicts to stdout and red ones
            # to stderr. Capturing stdout alone leaves status/<slug> empty for
            # exactly the crates the notify job needs to name.
            verdict=$("${GITHUB_WORKSPACE}/scripts/mutation-classify.sh" \
              "${rc}" "${crate_dir}/mutants.out/outcomes.json" "${crate_dir}" 2>&1) || cls=$?
            printf '%s\n' "${verdict}" \
              | tee -a "${GITHUB_STEP_SUMMARY}" "${GITHUB_WORKSPACE}/status/${slug}"
            [[ ${cls} -eq 0 ]] || failed=1
          done
          exit "${failed}"

      - name: Upload mutants output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-output
          path: |
            **/mutants.out/
            status/
            marker/
          retention-days: 30

  notify:
    needs: [mutants]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: dl
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: mutants-output
          path: artifact
          digest-mismatch: error
      - name: File, comment, or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.mutants.result }}
          DL_OUTCOME: ${{ steps.dl.outcome }}
          ARTIFACT_DIR: artifact
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: "mutation-testing: monthly run failed"
          ISSUE_LABEL: mutation-failure
          UNIT_NOUN: crate
          REPO: ${{ github.repository }}
        run: scripts/mutation-notify.sh
