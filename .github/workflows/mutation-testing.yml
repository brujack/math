name: mutation-testing

# Runs cargo-mutants against Rust crates to verify tests actually catch bugs.
# Coverage % measures whether code is exercised; mutation testing measures
# whether tests catch behavior changes.
#
# Triggered manually (workflow_dispatch) or weekly on schedule. Not on every PR
# because mutant runs can take 10+ minutes per crate.

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Specific crate to test (relative path, e.g. 'collatz/collatz-rs'). Leave empty for all."
        required: false
        default: ""
  schedule:
    # Monthly run catches test-quality regressions
    - cron: "0 4 1 * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutants
        env:
          CRATE: ${{ github.event.inputs.crate }}
        run: |
          target="${CRATE}"
          if [[ -n "${target}" ]]; then
            crate_dirs="${target}"
          else
            crate_dirs=$(find . -name Cargo.toml -not -path '*/target/*' -not -path '*/.cache/*' -exec dirname {} \;)
          fi

          mkdir -p "${GITHUB_WORKSPACE}/status"
          failed=0
          for crate_dir in ${crate_dirs}; do
            printf "\n=== Mutation testing %s ===\n" "${crate_dir}"
            make -C "${crate_dir}" mutants; rc=$?
            slug="$(printf '%s' "${crate_dir#./}" | tr '/' '-')"
            if "${GITHUB_WORKSPACE}/scripts/mutation-classify.sh" \
                 "${rc}" "${crate_dir}/mutants.out/outcomes.json" "${crate_dir}" \
                 | tee -a "${GITHUB_STEP_SUMMARY}" "${GITHUB_WORKSPACE}/status/${slug}"; then
              :
            else
              failed=1
            fi
          done
          exit "${failed}"

      - name: Upload mutants output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-output
          path: |
            **/mutants.out/
            status/
          retention-days: 30
