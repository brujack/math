name: mutation-testing

# Runs cargo-mutants against Rust crates to verify tests actually catch bugs.
# Coverage % measures whether code is exercised; mutation testing measures
# whether tests catch behavior changes.
#
# Triggered manually (workflow_dispatch) or monthly on schedule. Not on every PR
# because mutant runs can take 10+ minutes per crate. One job per shard of at
# most 75 mutants (scripts/mutation-rs-plan.sh --whole).

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Specific crate to test (relative path, e.g. 'collatz/collatz-rs'). Leave empty for all."
        required: false
        default: ""
  schedule:
    # Monthly run catches test-quality regressions
    - cron: "0 4 1 * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  setup:
    name: List crates and build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The planner lists mutants with cargo-mutants but builds nothing, so
      # this job needs no toolchain step (mutation-pr.yml's plan job does the same).
      - name: Install cargo-mutants
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-mutants@27.1.0
          fallback: none

      - name: List crates and build matrix
        id: plan
        env:
          CRATE: ${{ github.event.inputs.crate }}
        run: |
          # Tracked manifests only: `find` also matched tests/fixtures/**/Cargo.toml.
          tracked=()
          while IFS= read -r manifest; do
            tracked+=("$(dirname "${manifest}")")
          done < <(git ls-files '*/*-rs/Cargo.toml')

          if [[ -n "${CRATE}" ]]; then
            # Free text from a dispatch input must not reach GITHUB_OUTPUT
            # unchecked (a newline would write a second output line).
            match=0
            for dir in "${tracked[@]}"; do
              [[ "${dir}" == "${CRATE}" ]] && match=1
            done
            if [[ ${match} -eq 0 ]]; then
              printf 'error: unknown crate %q (not a tracked */*-rs crate)\n' "${CRATE}" >&2
              exit 1
            fi
            dirs=("${CRATE}")
          else
            dirs=("${tracked[@]}")
          fi

          # An empty list (a layout change or a git failure) would build an
          # empty matrix and report green having tested nothing.
          if [[ ${#dirs[@]} -eq 0 ]]; then
            printf "error: no crates found to test — refusing to report green\n" >&2
            exit 1
          fi

          # The planner prints units on stdout only (its plan:/red: lines go to
          # stderr, so never 2>&1 here) and exits 1 on a bad crate dir or more
          # than 256 units, which fails this step under bash -e before any
          # output is written. A crate whose listing faults arrives as a unit
          # with a "fault" field, so its leg reports red instead of vanishing.
          plan=$(scripts/mutation-rs-plan.sh --whole "${dirs[@]}")
          matrix=$(jq -c '{include: .}' <<< "${plan}")
          units=$(jq -r '[.[].slug] | join(" ")' <<< "${plan}")
          # An empty plan would build an empty matrix and report green.
          if [[ -z "${units}" ]]; then
            printf "error: empty mutation plan — refusing to report green\n" >&2
            exit 1
          fi
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"
          printf 'units=%s\n' "${units}" >> "${GITHUB_OUTPUT}"

  mutants:
    name: Mutation ${{ matrix.slug }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mark job start
        run: mkdir -p "${GITHUB_WORKSPACE}/marker" && date -u > "${GITHUB_WORKSPACE}/marker/job-began"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install cargo-mutants
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-mutants@27.1.0
          fallback: none

      - name: GMP cache key
        id: gmpkey
        working-directory: ${{ github.workspace }}
        run: |
          printf 'GMP_MPFR_SYS_CACHE=%s\n' "${RUNNER_TEMP}/gmp-mpfr-sys" >> "$GITHUB_ENV"
          scripts/gmp-cache-key.sh >> "$GITHUB_OUTPUT"

      - name: Restore GMP/MPFR build cache
        if: steps.gmpkey.outputs.enabled == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gmp-mpfr-sys
          key: ${{ steps.gmpkey.outputs.key }}
          restore-keys: ${{ steps.gmpkey.outputs.prefix }}

      - name: Run mutants
        env:
          CRATE_DIR: ${{ matrix.crate }}
          SLUG: ${{ matrix.slug }}
          K: ${{ matrix.k }}
          N: ${{ matrix.n }}
          COUNT: ${{ matrix.count }}
          FAULT: ${{ matrix.fault }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/status"
          # A crate whose mutant listing faulted has no shard to run: report it
          # red under its own slug so the notify job names it.
          if [[ -n "${FAULT}" ]]; then
            printf 'red: %s - plan fault: %s\n' "${SLUG}" "${FAULT}" \
              | tee -a "${GITHUB_STEP_SUMMARY}" "${GITHUB_WORKSPACE}/status/${SLUG}"
            exit 1
          fi
          # make exits 2 for ANY failed recipe, which the classifier would
          # read as cargo-mutants' survivors code. The recipe records
          # cargo-mutants' own exit code in mutants.out/exit-code; classify
          # on that, and fail closed when it is missing (the recipe died
          # before cargo-mutants ran).
          make -C "${CRATE_DIR}" mutants MUTANT_SHARD="${K}/${N}" || true
          # scripts/mutation-exit-code.sh owns the missing-file and plain-integer
          # rules (the classifier's `-eq` reads '' or text as 0, i.e. green).
          # Its red line arrives on stderr; 2>&1 puts it in rc so it reaches
          # the summary and status/<slug> like every other verdict.
          if ! rc=$(bash scripts/mutation-exit-code.sh "${CRATE_DIR}" 2>&1); then
            printf '%s\n' "${rc}" \
              | tee -a "${GITHUB_STEP_SUMMARY}" "${GITHUB_WORKSPACE}/status/${SLUG}"
            exit 1
          fi
          # The shard must have tested exactly the mutants the plan counted: a
          # short count means mutants went unrun. The helper prints its red line
          # on stdout; an empty line with a failure is a usage error, still red.
          count_rc=0
          count_line=$(bash scripts/mutation-shard-count.sh \
            "${CRATE_DIR}/mutants.out/outcomes.json" "${SLUG}" "${COUNT}") || count_rc=$?
          if [[ "${count_rc}" -ne 0 ]]; then
            [[ -n "${count_line}" ]] || count_line="red: ${SLUG} - shard count check failed (exit ${count_rc})"
            printf '%s\n' "${count_line}" \
              | tee -a "${GITHUB_STEP_SUMMARY}" "${GITHUB_WORKSPACE}/status/${SLUG}"
            exit 1
          fi
          # Capture the verdict and its exit code BEFORE any pipe. Piping the
          # classifier into tee makes the pipeline's status tee's, which always
          # succeeds -- so a red crate was printed, written to status/, and
          # then silently dropped. Measured: the first full sweep reported
          # success with two red crates in its own log.
          # `|| cls=$?` and not `; cls=$?`: a command-substitution assignment
          # takes the command's exit status, so under GitHub's `bash -e` a red
          # verdict would abort the block here instead of being recorded.
          cls=0
          # Trailing `0 1` = max_missed 0, min_caught 1 (ADR-0042): any survivor
          # is red, caught < 1 is red, and timeouts stay green beside a catch.
          # 2>&1: the classifier prints green verdicts to stdout and red ones
          # to stderr. Capturing stdout alone leaves status/<slug> empty for
          # exactly the crates the notify job needs to name.
          verdict=$("${GITHUB_WORKSPACE}/scripts/mutation-classify.sh" \
            "${rc}" "${CRATE_DIR}/mutants.out/outcomes.json" "${CRATE_DIR}" 0 1 2>&1) || cls=$?
          printf '%s\n' "${verdict}" \
            | tee -a "${GITHUB_STEP_SUMMARY}" "${GITHUB_WORKSPACE}/status/${SLUG}"
          exit "${cls}"

      - name: Record unfinished crate
        if: cancelled()
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/status"
          status_file="${GITHUB_WORKSPACE}/status/${SLUG}"
          if [[ ! -e "${status_file}" ]]; then
            printf "red: %s — did not finish (cancelled or timed out)\n" "${SLUG}" > "${status_file}"
          fi

      - name: Upload crate status
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-status-${{ matrix.slug }}
          path: |
            status/
            marker/
          retention-days: 30

      - name: Upload crate output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mutants-output-${{ matrix.slug }}
          # marker/ keeps the artifact root at the workspace, so the crate
          # prefix survives: the artifact unpacks to <crate>/mutants.out/.
          path: |
            ${{ matrix.crate }}/mutants.out/
            marker/
          retention-days: 30

  notify:
    needs: [setup, mutants]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: dl
        if: always()
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        continue-on-error: true
        with:
          pattern: mutants-status-*
          merge-multiple: true
          path: artifact
          digest-mismatch: error
      - name: File, comment, or close the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.mutants.result }}
          DL_OUTCOME: ${{ steps.dl.outcome }}
          ARTIFACT_DIR: artifact
          EXPECTED_STATUS_UNITS: ${{ needs.setup.outputs.units }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: "mutation-testing: monthly run failed"
          ISSUE_LABEL: mutation-failure
          UNIT_NOUN: crate
          REPO: ${{ github.repository }}
          FULL_SWEEP: ${{ format('{0}', inputs.crate) == '' && 'true' || 'false' }}
        run: scripts/mutation-notify.sh
