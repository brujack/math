name: mutation-testing

# Runs cargo-mutants against Rust crates to verify tests actually catch bugs.
# Coverage % measures whether code is exercised; mutation testing measures
# whether tests catch behavior changes.
#
# Triggered manually (workflow_dispatch) or weekly on schedule. Not on every PR
# because mutant runs can take 10+ minutes per crate.

on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Specific crate to test (relative path, e.g. 'collatz/collatz-rs'). Leave empty for all."
        required: false
        default: ""
  schedule:
    # Monthly run catches test-quality regressions
    - cron: "0 4 1 * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutants:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutants
        run: |
          set -e
          target="${{ github.event.inputs.crate }}"
          if [[ -n "${target}" ]]; then
            printf "Mutation testing single crate: %s\n" "${target}"
            cd "${target}"
            cargo mutants --timeout 120 --no-shuffle
          else
            failed=0
            for cargo_toml in $(find . -name Cargo.toml -not -path '*/target/*' -not -path '*/.cache/*'); do
              crate_dir=$(dirname "${cargo_toml}")
              printf "\n=== Mutation testing %s ===\n" "${crate_dir}"
              (cd "${crate_dir}" && cargo mutants --timeout 120 --no-shuffle) || failed=1
            done
            exit "${failed}"
          fi

      - name: Upload mutants output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-output
          path: "**/mutants.out/"
          retention-days: 30
