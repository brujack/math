name: release-e-rs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix (e.g. 1.2.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release e-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: e/e-rs

      - name: Run tests
        run: make test
        working-directory: e/e-rs

      - name: Build release binary
        run: cargo build --release
        working-directory: e/e-rs

      - name: Generate CHANGELOG
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4
        with:
          config: cliff.toml
          args: --verbose --include-path "e/**" --tag-pattern "e-v.*"
        env:
          OUTPUT: e/e-rs/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes (latest only)
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4
        with:
          config: cliff.toml
          args: --latest --strip all --include-path "e/**" --tag-pattern "e-v.*"
        env:
          OUTPUT: /tmp/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit CHANGELOG
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e/e-rs/CHANGELOG.md
          git diff --staged --quiet && exit 0
          git commit -m "chore(changelog): update e for v${VERSION}"
          git push

      - name: Generate SHA256 checksum
        run: |
          (cd e/e-rs/target/release && sha256sum e) > e/e-rs/target/release/e.sha256
          cat e/e-rs/target/release/e.sha256

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "e-v${VERSION}"
          git push origin "e-v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: "e-v${{ inputs.version }}"
          name: "e v${{ inputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            e/e-rs/target/release/e
            e/e-rs/target/release/e.sha256

  sign:
    needs: [release]
    uses: ./.github/workflows/release-sign.yml
    with:
      release_tag: "e-v${{ inputs.version }}"
      binary_name: "e"
    permissions:
      id-token: write
      contents: write
