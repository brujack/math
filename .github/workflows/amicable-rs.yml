name: amicable-rs

on:
  pull_request:
    branches: [master]
    paths:
      - "amicable/amicable-rs/**"
      - ".github/workflows/amicable-rs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: amicable/amicable-rs
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      - run: make test
        working-directory: amicable/amicable-rs
      - name: Coverage
        run: cargo tarpaulin --out Json --fail-under 90
        working-directory: amicable/amicable-rs

      - name: Publish coverage badge
        working-directory: ${{ github.workspace }}
        run: |
          PCT=$(python3 -c "import json,math; d=json.load(open('amicable/amicable-rs/tarpaulin-report.json')); print(math.floor(d['coverage']))")
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add -b coverage-data --orphan /tmp/cov-data
          mkdir -p /tmp/cov-data/amicable
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/amicable/rust.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for i in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: amicable/rust.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: amicable/amicable-rs
      - run: cargo build --release
        working-directory: amicable/amicable-rs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: amicable
          path: amicable/amicable-rs/target/release/amicable
          retention-days: 7
