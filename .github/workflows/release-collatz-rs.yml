name: release-collatz-rs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix (e.g. 1.2.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release collatz-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: collatz/collatz-rs

      - name: Run tests
        run: make test
        working-directory: collatz/collatz-rs

      - name: Build release binary
        run: cargo build --release
        working-directory: collatz/collatz-rs

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match="collatz-v*" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" -- collatz/collatz-rs/ || true)
          else
            NOTES=$(git log HEAD --pretty=format:"- %s" -- collatz/collatz-rs/ || true)
          fi
          DELIMITER="EOF_$(openssl rand -hex 8)"
          {
            printf 'notes<<%s\n' "${DELIMITER}"
            printf '%s\n' "${NOTES}"
            printf '%s\n' "${DELIMITER}"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "collatz-v${VERSION}"
          git push origin "collatz-v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "collatz-v${{ inputs.version }}"
          name: "collatz v${{ inputs.version }}"
          body: "${{ steps.notes.outputs.notes }}"
          files: collatz/collatz-rs/target/release/collatz

  sign:
    needs: [release]
    uses: ./.github/workflows/release-sign.yml
    with:
      release_tag: "collatz-v${{ inputs.version }}"
      binary_name: "collatz"
    permissions:
      id-token: write
      contents: write
