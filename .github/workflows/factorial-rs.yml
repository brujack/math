name: factorial-rs

on:
  pull_request:
    branches:
      - master
    paths:
      - "factorial/factorial-rs/**"
      - ".github/workflows/factorial-rs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test factorial-rs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: factorial/factorial-rs
    steps:
      - uses: actions/checkout@v6

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: factorial/factorial-rs

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run tests
        working-directory: factorial/factorial-rs
        run: make lint && cargo nextest run --profile ci
      - name: Install Python dependencies
        if: always()
        run: pip install defusedxml

      - name: Generate test metrics
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/test_metrics.py \
            --repo math \
            --run-id "${GH_RUN_ID}" \
            --junit factorial/factorial-rs/target/nextest/ci/junit.xml \
            --artifact-name test-metrics-factorial-rs
      - name: Upload test metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-metrics-factorial-rs
          path: test-metrics.json
          retention-days: 90

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Check coverage (≥90%)
        run: cargo tarpaulin --out Json --fail-under 90

      - name: Publish coverage badge
        working-directory: ${{ github.workspace }}
        run: |
          PCT=$(python3 -c "import json,math; d=json.load(open('factorial/factorial-rs/tarpaulin-report.json')); print(math.floor(d['coverage']))")
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add -b coverage-data --orphan /tmp/cov-data
          mkdir -p /tmp/cov-data/factorial
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/factorial/rust.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for i in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: factorial/rust.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done

  build:
    name: Build factorial-rs
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: factorial/factorial-rs
    steps:
      - uses: actions/checkout@v6

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: factorial/factorial-rs

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: factorial
          path: factorial/factorial-rs/target/release/factorial
          retention-days: 7
