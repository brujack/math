name: factorial-rs

on:
  pull_request:
    branches:
      - master
    paths:
      - "factorial/factorial-rs/**"
      - ".github/workflows/factorial-rs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test factorial-rs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: factorial/factorial-rs
    steps:
      - uses: actions/checkout@v5

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: factorial/factorial-rs

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run tests
        run: make test

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Check coverage (≥90%)
        run: cargo tarpaulin --fail-under 90

  build:
    name: Build factorial-rs
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: factorial/factorial-rs
    steps:
      - uses: actions/checkout@v5

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: factorial/factorial-rs

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: factorial
          path: factorial/factorial-rs/target/release/factorial
          retention-days: 7
