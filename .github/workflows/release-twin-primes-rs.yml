name: release-twin-primes-rs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix (e.g. 1.2.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release twin-primes-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          checked=$(scripts/check-release-version.sh twin-primes/twin-primes-rs "${VERSION}")
          echo "version=${checked}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: twin-primes/twin-primes-rs

      # Prebuilt, checksum-verified binaries; fallback: none makes an unknown tool
      # fail instead of downloading unverified.
      - name: Install cargo-nextest and cargo-machete
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-nextest@0.9.148,cargo-machete@0.9.2
          fallback: none

      - name: Run tests
        run: make test
        working-directory: twin-primes/twin-primes-rs

      - name: Install cargo-auditable
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-auditable@0.7.5
          fallback: none

      - name: Build release binary
        run: cargo auditable build --release
        working-directory: twin-primes/twin-primes-rs

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4
        with:
          config: cliff.toml
          args: --unreleased --tag "twin-primes-v${{ steps.version.outputs.version }}" --strip all --include-path "twin-primes/**" --tag-pattern "^twin-primes-v.*"
        env:
          OUTPUT: /tmp/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate SHA256 checksum
        run: |
          (cd twin-primes/twin-primes-rs/target/release && sha256sum twin-primes) > twin-primes/twin-primes-rs/target/release/twin-primes.sha256
          cat twin-primes/twin-primes-rs/target/release/twin-primes.sha256

      - name: Write third-party notices
        run: |
          mkdir -p "${RUNNER_TEMP}/notices"
          scripts/third-party-notices.sh twin-primes/twin-primes-rs "${RUNNER_TEMP}/notices"

      - uses: ./.github/actions/sbom-sign
        with:
          binary_path: twin-primes/twin-primes-rs/target/release
          binary_name: twin-primes

      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "twin-primes-v${VERSION}"
          git push origin "twin-primes-v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: "twin-primes-v${{ steps.version.outputs.version }}"
          name: "twin-primes v${{ steps.version.outputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            twin-primes/twin-primes-rs/target/release/twin-primes
            twin-primes/twin-primes-rs/target/release/twin-primes.sha256
            twin-primes/twin-primes-rs/target/release/twin-primes.sbom.spdx.json
            twin-primes/twin-primes-rs/target/release/twin-primes.bundle
            ${{ runner.temp }}/notices/THIRD-PARTY-NOTICES.txt
          fail_on_unmatched_files: true
