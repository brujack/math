name: release-perfect-numbers-rs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix (e.g. 1.2.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release perfect-numbers-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: perfect-numbers/perfect-numbers-rs

      - name: Run tests
        run: make test
        working-directory: perfect-numbers/perfect-numbers-rs

      - name: Build release binary
        run: cargo build --release
        working-directory: perfect-numbers/perfect-numbers-rs

      - name: Generate CHANGELOG
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4
        with:
          config: cliff.toml
          args: --verbose --include-path "perfect-numbers/**" --tag-pattern "perfect-numbers-v.*"
        env:
          OUTPUT: perfect-numbers/perfect-numbers-rs/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes (latest only)
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5  # v4
        with:
          config: cliff.toml
          args: --latest --strip all --include-path "perfect-numbers/**" --tag-pattern "perfect-numbers-v.*"
        env:
          OUTPUT: /tmp/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit CHANGELOG
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add perfect-numbers/perfect-numbers-rs/CHANGELOG.md
          git diff --staged --quiet && exit 0
          git commit -m "chore(changelog): update perfect-numbers for v${VERSION}"
          git push

      - name: Generate SHA256 checksum
        run: |
          (cd perfect-numbers/perfect-numbers-rs/target/release && sha256sum perfect-numbers) > perfect-numbers/perfect-numbers-rs/target/release/perfect-numbers.sha256
          cat perfect-numbers/perfect-numbers-rs/target/release/perfect-numbers.sha256

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "perfect-numbers-v${VERSION}"
          git push origin "perfect-numbers-v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "perfect-numbers-v${{ inputs.version }}"
          name: "perfect-numbers v${{ inputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            perfect-numbers/perfect-numbers-rs/target/release/perfect-numbers
            perfect-numbers/perfect-numbers-rs/target/release/perfect-numbers.sha256

  sign:
    needs: [release]
    uses: ./.github/workflows/release-sign.yml
    with:
      release_tag: "perfect-numbers-v${{ inputs.version }}"
      binary_name: "perfect-numbers"
    permissions:
      id-token: write
      contents: write
