name: sq-rs

on:
  pull_request:
    branches:
      - master
    paths:
      - "sq/sq-rs/**"
      - ".github/workflows/sq-rs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test sq-rs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: sq/sq-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: sq/sq-rs

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.148

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version 0.9.2

      - name: Run tests
        # nextest reads NEXTEST_PROFILE: the ci profile writes the JUnit report
        # test_metrics.py reads, while make test stays the single test definition.
        env:
          NEXTEST_PROFILE: ci
        run: make test

      - name: Install Python dependencies
        if: always()
        run: pip install defusedxml==0.7.1

      - name: Generate test metrics
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 scripts/test_metrics.py \
            --repo math \
            --run-id "${GH_RUN_ID}" \
            --junit sq/sq-rs/target/nextest/ci/junit.xml \
            --artifact-name test-metrics-sq-rs
      - name: Upload test metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-metrics-sq-rs
          path: test-metrics.json
          retention-days: 90

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked --version 0.37.5

      - name: Check coverage (≥90%)
        run: cargo tarpaulin --out Json --fail-under 90

      - name: Publish coverage badge
        working-directory: ${{ github.workspace }}
        run: |
          PCT=$(python3 -c "import json,math; d=json.load(open('sq/sq-rs/tarpaulin-report.json')); print(math.floor(d['coverage']))")
          if   [ "$PCT" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 80 ]; then COLOR="green"
          elif [ "$PCT" -ge 70 ]; then COLOR="yellow"
          elif [ "$PCT" -ge 60 ]; then COLOR="orange"
          else                         COLOR="red"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin coverage-data 2>/dev/null && \
            git worktree add /tmp/cov-data coverage-data || \
            git worktree add -b coverage-data --orphan /tmp/cov-data
          mkdir -p /tmp/cov-data/sq
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
            "$PCT" "$COLOR" > /tmp/cov-data/sq/rust.json
          cd /tmp/cov-data
          git add .
          git diff --staged --quiet && exit 0
          for i in 1 2 3; do
            git pull origin coverage-data --rebase 2>/dev/null || true
            git diff --staged --quiet || git commit -m "coverage: sq/rust.json → ${PCT}%"
            git push origin coverage-data && break
            sleep $((RANDOM % 5 + 1))
          done

  build:
    name: Build sq-rs
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: sq/sq-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: sq/sq-rs

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sq
          path: sq/sq-rs/target/release/sq
          retention-days: 7
