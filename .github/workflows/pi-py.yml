name: pi.py

on:
  pull_request:
    branches:
      - master
    paths:
      - "pi/*.py"
      - "pi/install_deps.sh"
      - "pi/Makefile"
      - ".github/workflows/pi-py.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test pi.py
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pi
    steps:
      - uses: actions/checkout@v5

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - name: Install Python dependencies
        run: pip install mpmath gmpy2 coverage ruff

      - name: Run tests
        run: make test
      - name: Check coverage (>=90%)
        run: make coverage
      - name: Benchmark (timeout gate)
        run: make benchmark
        continue-on-error: true
