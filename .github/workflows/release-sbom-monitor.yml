name: Release SBOM Monitor

on:
  workflow_call:
    inputs:
      binary_name:
        required: true
        type: string
      release_tag_pattern:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      binary_name:
        required: true
        type: string
        description: "Binary name (e.g. factorial)"
      release_tag_pattern:
        required: true
        type: string
        description: "Tag prefix to match latest release (e.g. factorial-v)"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  monitor:
    name: SBOM Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve latest matching release tag
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_PATTERN: ${{ inputs.release_tag_pattern }}
        run: |
          # Capture before head: piping gh straight into head would hide its exit
          # status (no pipefail here), turning an API failure into "no release".
          TAGS=$(gh release list --limit 1000 --json tagName \
            --jq ".[] | select(.tagName | startswith(\"${TAG_PATTERN}\")) | .tagName")
          LATEST_TAG=$(printf '%s\n' "${TAGS}" | head -1)
          if [[ -z "${LATEST_TAG}" ]]; then
            # A crate with no release yet is legitimate, but must not read as a scan.
            echo "::warning::No release matches ${TAG_PATTERN}; nothing scanned"
            echo "- \`${TAG_PATTERN}\`: no matching release, not scanned" >> "$GITHUB_STEP_SUMMARY"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      - name: Download SBOM asset
        if: steps.latest.outputs.found == 'true'
        id: sbom
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          BINARY_NAME: ${{ inputs.binary_name }}
        run: |
          # Every release ships an SBOM (ADR-0026), so a missing one is a broken
          # release or a failed download, and either must turn the job red.
          if ! gh release download "${LATEST_TAG}" \
              --pattern "${BINARY_NAME}.sbom.spdx.json"; then
            echo "::error::${LATEST_TAG} has no ${BINARY_NAME}.sbom.spdx.json asset, or the download failed"
            echo "- \`${LATEST_TAG}\`: SBOM missing or download failed, not scanned" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Scan SBOM
        if: steps.latest.outputs.found == 'true' && steps.sbom.outputs.present == 'true'
        id: scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          sbom: "${{ inputs.binary_name }}.sbom.spdx.json"
          output-format: json
          fail-build: false

      - name: Filter Critical/High and file issues
        if: steps.latest.outputs.found == 'true' && steps.sbom.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BINARY_NAME: ${{ inputs.binary_name }}
          LATEST_TAG: ${{ steps.latest.outputs.tag }}
          SCAN_JSON: ${{ steps.scan.outputs.json }}
        run: |
          # Read the findings before looping: `jq ... | while` has no pipefail, so a
          # missing or unreadable scan output would loop zero times and pass.
          if [[ ! -s "${SCAN_JSON}" ]]; then
            echo "::error::grype scan output '${SCAN_JSON}' is missing or empty"
            echo "- \`${LATEST_TAG}\`: scan output missing, not scanned" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          FINDINGS=$(jq -c '.matches[] | select(.vulnerability.severity == "Critical" or .vulnerability.severity == "High")' \
            "${SCAN_JSON}")
          TOTAL=$(jq '.matches | length' "${SCAN_JSON}")
          SERIOUS=$(printf '%s' "${FINDINGS}" | grep -c . || true)
          echo "- \`${LATEST_TAG}\`: scanned, ${TOTAL} matches, ${SERIOUS} Critical/High" >> "$GITHUB_STEP_SUMMARY"
          [[ -z "${FINDINGS}" ]] && exit 0
          while read -r finding; do
            CVE_ID=$(echo "${finding}" | jq -r '.vulnerability.id')
            SEVERITY=$(echo "${finding}" | jq -r '.vulnerability.severity')
            PACKAGE_NAME=$(echo "${finding}" | jq -r '.artifact.name')
            PACKAGE_VERSION=$(echo "${finding}" | jq -r '.artifact.version')
            FIX_VERSION=$(echo "${finding}" | jq -r '.vulnerability.fix.versions[0] // "none"')

            EXISTING=$(gh issue list --label sbom-monitor --state open \
              --search "\"[SBOM Monitor] ${CVE_ID} in ${BINARY_NAME}\" in:title" \
              --json number --jq '.[0].number // empty')

            if [[ -n "${EXISTING}" ]]; then
              echo "Issue already open for ${CVE_ID} in ${BINARY_NAME}: #${EXISTING}"
              continue
            fi

            gh issue create \
              --label sbom-monitor \
              --title "[SBOM Monitor] ${CVE_ID} in ${BINARY_NAME} ${LATEST_TAG}" \
              --body "Severity: ${SEVERITY}
            Package: ${PACKAGE_NAME} ${PACKAGE_VERSION}
            Fix available: ${FIX_VERSION}
            Release: ${LATEST_TAG}
            Source: monthly release-sbom-monitor.yml scan

            Non-blocking. Human judgment call on whether this warrants a patch release
            (reachability, exploitability, whether ${LATEST_TAG} is still actively downloaded)."
          done <<< "${FINDINGS}"
