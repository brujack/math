name: cargo-audit

on:
  pull_request:
    branches:
      - master
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/cargo-audit.yml"
  schedule:
    # Weekly run catches newly-published advisories against existing lockfiles
    - cron: "0 6 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: Audit Rust crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit each Rust crate
        run: |
          set -e
          failed=0
          for cargo_toml in $(find . -name Cargo.toml -not -path '*/target/*' -not -path '*/.cache/*'); do
            crate_dir=$(dirname "${cargo_toml}")
            printf "\n=== Auditing %s ===\n" "${crate_dir}"
            (cd "${crate_dir}" && cargo audit) || failed=1
          done
          exit "${failed}"
