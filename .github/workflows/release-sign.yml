name: Release Sign

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      binary_name:
        required: true
        type: string

jobs:
  sign:
    name: SBOM + Sign
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download binary from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BINARY_NAME: ${{ inputs.binary_name }}
        run: |
          gh release download "${RELEASE_TAG}" \
            --pattern "${BINARY_NAME}"

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Generate SBOM
        env:
          BINARY_NAME: ${{ inputs.binary_name }}
        run: |
          syft "${BINARY_NAME}" \
            -o spdx-json \
            --file "${BINARY_NAME}.sbom.spdx.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binary (keyless)
        env:
          BINARY_NAME: ${{ inputs.binary_name }}
        run: |
          cosign sign-blob --yes "${BINARY_NAME}" \
            --bundle "${BINARY_NAME}.bundle"

      - name: Upload signatures and SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BINARY_NAME: ${{ inputs.binary_name }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            "${BINARY_NAME}.bundle" \
            "${BINARY_NAME}.sbom.spdx.json"
