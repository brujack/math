name: e-rs

on:
  pull_request:
    branches:
      - master
    paths:
      - "e/e-rs/**"
      - ".github/workflows/e-rs.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test e-rs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e/e-rs
    steps:
      - uses: actions/checkout@v5

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e/e-rs

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run tests
        run: make test

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Check coverage (≥90%)
        run: cargo tarpaulin --fail-under 90

  build:
    name: Build e-rs
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: e/e-rs
    steps:
      - uses: actions/checkout@v5

      - name: Install GMP and MPFR
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev libmpfr-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e/e-rs

      - name: Build
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: e
          path: e/e-rs/target/release/e
          retention-days: 7
