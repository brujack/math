name: scripts
on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/scripts.yml"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install bats-core
        run: sudo apt-get install -y bats shellcheck
      - name: Install Python dependencies
        run: pip install defusedxml pyright pip-audit
      - name: Lint hooks, scripts and bats suites
        run: make lint-hooks
      - name: Run hook and script tests
        run: bats --recursive tests/
      - name: Run pyright
        run: pyright
        working-directory: scripts
      - name: Run pip-audit
        run: pip-audit
        continue-on-error: true
