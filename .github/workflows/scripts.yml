name: scripts
on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/**"
      - "tests/**"
      - "Makefile"
      - ".github/workflows/scripts.yml"
      - ".github/workflows/release-*"
      # Rendered from scripts/crate_templates/; test_crate_uniformity checks them.
      - "*/*-rs/Makefile"
      - "*/Makefile"
      - "*/install_deps.sh"
      - "*/*-rs/rustfmt.toml"
      - "*/*-rs/.config/nextest.toml"
      - "*/*-rs/install_deps.sh"
      - ".github/workflows/*-rs.yml"
      - ".github/workflows/*-py.yml"
      - ".github/actions/**"
      - "pyrightconfig.json"
      - "requirements-dev.txt"
      - ".claude/scripts/**"
      # Subjects of root unittest suites: test_automerge_bot_hold.py runs the
      # hold step extracted from auto-merge.yml, test_renovate_automerge_policy.py
      # asserts renovate.json, test_gmpy2_stub.py guards typings/gmpy2 (pyright accepts
      # Any in a stub). Without these an edit to any of them skips its test.
      - ".github/workflows/auto-merge.yml"
      - "renovate.json"
      - "typings/**"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install bats-core
        run: sudo apt-get install -y bats
      - name: Install shellcheck (pinned)
        env:
          SC_VER: "0.11.0"
          SC_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
        run: |
          curl -fsSL -o /tmp/sc.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SC_VER}/shellcheck-v${SC_VER}.linux.x86_64.tar.xz"
          echo "${SC_SHA256}  /tmp/sc.tar.xz" | sha256sum -c -
          tar -xJf /tmp/sc.tar.xz -C /tmp
          sudo install -m755 "/tmp/shellcheck-v${SC_VER}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version | grep -q "version: ${SC_VER}"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt ruff==0.16.4 pyright==1.1.411 pip-audit
      - name: Lint hooks, scripts and bats suites
        run: make lint
      - name: Run hook and script tests
        run: bats --recursive tests/

      - name: Run Python tests
        run: make test-python
      - name: Run pyright
        run: pyright
      - name: Run pip-audit
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/pip_audit_advisory.py"
          cat pip-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
