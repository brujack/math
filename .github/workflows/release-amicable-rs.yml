name: release-amicable-rs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix (e.g. 1.2.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release amicable-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: amicable/amicable-rs

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --version 0.9.149

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version 0.9.2

      - name: Run tests
        run: make test
        working-directory: amicable/amicable-rs

      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked --version 0.7.5

      - name: Build release binary
        run: cargo auditable build --release
        working-directory: amicable/amicable-rs

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff  # v4
        with:
          config: cliff.toml
          args: --unreleased --tag "amicable-v${{ inputs.version }}" --strip all --include-path "amicable/**" --tag-pattern "^amicable-v.*"
        env:
          OUTPUT: /tmp/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate SHA256 checksum
        run: |
          (cd amicable/amicable-rs/target/release && sha256sum amicable) > amicable/amicable-rs/target/release/amicable.sha256
          cat amicable/amicable-rs/target/release/amicable.sha256

      - uses: ./.github/actions/sbom-sign
        with:
          binary_path: amicable/amicable-rs/target/release
          binary_name: amicable

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "amicable-v${VERSION}"
          git push origin "amicable-v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: "amicable-v${{ inputs.version }}"
          name: "amicable v${{ inputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            amicable/amicable-rs/target/release/amicable
            amicable/amicable-rs/target/release/amicable.sha256
            amicable/amicable-rs/target/release/amicable.sbom.spdx.json
            amicable/amicable-rs/target/release/amicable.bundle
          fail_on_unmatched_files: true
