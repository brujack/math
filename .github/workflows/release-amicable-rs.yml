name: release-amicable-rs

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number without the v prefix (e.g. 1.2.0)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release amicable-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: amicable/amicable-rs

      - name: Run tests
        run: make test
        working-directory: amicable/amicable-rs

      - name: Build release binary
        run: cargo build --release
        working-directory: amicable/amicable-rs

      - name: Generate CHANGELOG
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2  # v4
        with:
          config: cliff.toml
          args: --verbose --include-path "amicable/**" --tag-pattern "amicable-v.*"
        env:
          OUTPUT: amicable/amicable-rs/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes (latest only)
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2  # v4
        with:
          config: cliff.toml
          args: --latest --strip all --include-path "amicable/**" --tag-pattern "amicable-v.*"
        env:
          OUTPUT: /tmp/release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit CHANGELOG
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add amicable/amicable-rs/CHANGELOG.md
          git diff --staged --quiet && exit 0
          git commit -m "chore(changelog): update amicable for v${VERSION}"
          git push

      - name: Generate SHA256 checksum
        run: |
          (cd amicable/amicable-rs/target/release && sha256sum amicable) > amicable/amicable-rs/target/release/amicable.sha256
          cat amicable/amicable-rs/target/release/amicable.sha256

      - name: Create and push tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "amicable-v${VERSION}"
          git push origin "amicable-v${VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: "amicable-v${{ inputs.version }}"
          name: "amicable v${{ inputs.version }}"
          body_path: /tmp/release-notes.md
          files: |
            amicable/amicable-rs/target/release/amicable
            amicable/amicable-rs/target/release/amicable.sha256

  sign:
    needs: [release]
    uses: ./.github/workflows/release-sign.yml
    with:
      release_tag: "amicable-v${{ inputs.version }}"
      binary_name: "amicable"
    permissions:
      id-token: write
      contents: write
