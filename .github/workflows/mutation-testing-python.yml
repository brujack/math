name: mutation-testing-python

# cosmic-ray runs every operator+line mutation against each Python sub-project's
# unittest suite. Surviving mutants = tests do not detect that behavior change.
# Slow per sub-project — monthly cron + manual dispatch.
# Non-blocking: report uploads as artifact, never gates merges.

on:
  workflow_dispatch:
    inputs:
      subproject:
        description: "Specific sub-project to test (e.g. 'fib'). Leave empty for all."
        required: false
        default: ""
  schedule:
    # Monthly — 2 hours after Rust mutation-testing cron (0 4 1 * *)
    - cron: "0 6 1 * *"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  mutants:
    name: Python mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install cosmic-ray
        run: pip install cosmic-ray

      - name: Run mutants
        env:
          TARGET: ${{ github.event.inputs.subproject }}
        run: |
          PYTHON_DIRS=(fib amicable collatz e factorial perfect-numbers pi sq)
          if [[ -n "${TARGET}" ]]; then
            dirs=("${TARGET}")
          else
            dirs=("${PYTHON_DIRS[@]}")
          fi

          # An empty dirs array (bad dispatch input, or PYTHON_DIRS list
          # drift) skips the loop entirely and exits 0 -- reporting green
          # having tested nothing.
          if [[ "${#dirs[@]}" -eq 0 ]]; then
            printf "error: no sub-projects found to test — refusing to report green\n" >&2
            exit 1
          fi

          mkdir -p "${GITHUB_WORKSPACE}/status"
          failed=0
          for dir in "${dirs[@]}"; do
            printf "\n=== Mutation testing %s ===\n" "${dir}"
            rc=0
            make -C "${dir}" mutants || rc=$?
            sqlite="${dir}/cosmic-ray-session.sqlite"

            if [[ "${rc}" -ne 0 ]]; then
              status="red: ${dir} — make mutants failed (exit ${rc})"
              failed=1
            elif [[ ! -f "${sqlite}" ]]; then
              status="red: ${dir} — cosmic-ray-session.sqlite missing after a successful run"
              failed=1
            else
              cr_out="$(mktemp)"
              if cr-report "${sqlite}" > "${cr_out}" 2>&1; then
                # A zero survivor count is not an error (grep -c returns 1
                # with no matches) -- only guard the grep, not cr-report
                # itself, which must still fail the sub-project on error.
                survivors=$(grep -c 'Outcome.SURVIVED' "${cr_out}" || true)
                status="green: ${dir} — ${survivors} surviving mutant(s)"
              else
                status="red: ${dir} — cr-report failed on ${sqlite}"
                failed=1
              fi
              rm -f "${cr_out}"
            fi

            printf "%s\n" "${status}" | tee -a "${GITHUB_STEP_SUMMARY}" "${GITHUB_WORKSPACE}/status/${dir}"
          done
          exit "${failed}"

      - name: Upload mutants reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-report-python
          path: |
            **/mutants-report.txt
            **/cosmic-ray-session.sqlite
            status/
          retention-days: 30

  notify:
    needs: [mutants]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          name: mutants-report-python
          path: artifact
      - name: File, comment, or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ needs.mutants.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          title="mutation-testing-python: monthly run failed"
          existing=$(gh issue list --state open --label mutation-failure \
            --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')

          if [[ "${RESULT}" == "success" ]]; then
            if [[ -n "${existing}" ]]; then
              gh issue comment "${existing}" --body "Green as of ${RUN_URL}. Closing."
              gh issue close "${existing}"
            fi
            exit 0
          fi

          if [[ -d artifact/status ]]; then
            subprojects=$(grep -l '^red' artifact/status/* 2>/dev/null \
              | xargs -r -n1 basename | sed 's/^/- /')
            detail="Failing sub-projects:"$'\n'"${subprojects:-- (none flagged; see run log)}"
          else
            detail="No artifact was produced. The runner was terminated (exit 143) or the job timed out, so the failing sub-project cannot be attributed from CI alone — inspect the run log."
          fi
          body="Run: ${RUN_URL}"$'\n\n'"${detail}"

          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh label create mutation-failure --color B60205 \
              --description "Monthly mutation run failed" 2>/dev/null || true
            gh issue create --title "${title}" --label mutation-failure --body "${body}"
          fi
