[package]
name = "e"
version = "0.1.0"
edition = "2021"
description = "High-precision e calculator — Taylor binary splitting + Rayon + GMP"

[[bin]]
name = "e"
path = "src/main.rs"

[dependencies]
rug = { version = "1", features = ["integer", "float"] }
rayon = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[profile.release]
opt-level   = 3
lto         = "thin"
codegen-units = 1
