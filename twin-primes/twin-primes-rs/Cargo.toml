[package]
name = "twin-primes"
version = "0.1.0"
edition = "2021"
description = "Find all twin prime pairs up to 10^N — segmented sieve"

[[bin]]
name = "twin-primes"
path = "src/main.rs"

[lib]
name = "twin_primes"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.8"

[[bench]]
name = "twin_primes"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
missing_debug_implementations = "warn"

[lints.clippy]
wrong_self_convention = "warn"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
