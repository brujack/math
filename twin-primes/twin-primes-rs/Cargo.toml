[package]
name = "twin-primes"
version = "0.1.0"
edition = "2021"
description = "Find all twin prime pairs up to 10^N — segmented sieve"

[[bin]]
name = "twin-primes"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
